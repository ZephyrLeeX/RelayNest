name: Server checks

on:
  push:
    paths:
      - 'server/**'
      - 'web/**'
      - '.github/workflows/server*'
  pull_request:
    paths:
      - 'server/**'
      - 'web/**'
      - '.github/workflows/server*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: 检出源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 设置固定 Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.2'
          # 禁用自动缓存；不复用 node_modules 或旧的内嵌资源。
          package-manager-cache: false

      - name: 验证 Node 和 npm 版本
        run: |
          node --version
          npm --version
          test "$(node --version)" = 'v22.23.2'
          test "$(npm --version)" = '10.9.8'

      # Go embed 依赖本次源码生成的 dist，必须在同一工作空间先构建 Web。
      - name: 安装锁定 Web 依赖
        run: npm --prefix web ci --no-audit --no-fund

      - name: 构建内嵌 Web
        run: npm --prefix web run build

      - name: 设置固定 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: 验证 Go 版本和依赖完整性
        working-directory: server
        run: |
          go version
          test "$(go env GOVERSION)" = 'go1.27.3'
          test "$(awk '$1 == "go" {print $2}' go.mod)" = '1.27.3'
          go mod download
          go mod verify

      - name: 检查 Go 格式
        working-directory: server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Go 静态检查
        working-directory: server
        run: go vet ./...

      - name: Go 竞态测试
        working-directory: server
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...

      - name: 从空 Go 构建缓存编译
        working-directory: server
        env:
          CGO_ENABLED: '0'
        run: |
          GOCACHE=$(mktemp -d)
          export GOCACHE
          trap 'rm -rf "$GOCACHE"' EXIT
          go build -trimpath -o "$RUNNER_TEMP/relaynest" ./cmd/relaynest

      - name: 确认锁文件未被构建改写
        run: git diff --exit-code -- server/go.mod server/go.sum web/package.json web/package-lock.json
