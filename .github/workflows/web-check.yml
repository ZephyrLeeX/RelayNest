name: Web checks

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web*'
      - 'mise.toml'
      - '.gitignore'
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web*'
      - 'mise.toml'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: web-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Verify toolchain
        run: |
          test "$(node --version)" = 'v22.23.2'
          test "$(npm --version)" = '10.9.8'

      - name: Install locked dependencies
        run: npm --prefix web ci --no-audit --no-fund

      - name: Check types
        run: npm --prefix web run typecheck

      - name: Build embedded assets
        # 同一作业从锁文件重建 Go 嵌入资源，不依赖其他工作流或缓存产物。
        run: |
          npm --prefix web run build
          test -s server/internal/webui/dist/index.html

      - name: Verify dependency files were not rewritten
        run: git diff --exit-code -- web/package.json web/package-lock.json
