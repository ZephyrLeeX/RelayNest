openapi: 3.1.0
info:
  title: RelayNest 核心 API
  version: 1.0.0
  description: P03-04～06：认证/Bot、消息/callback/Webhook/附件/历史、应用投递及失败管理契约。仅契约，不代表运行时路由已实现；P03-07继续同步/设备。JSON拒绝未知字段，受保护响应no-store。Web仅管理元数据，无正文/附件/历史；Hub不解释业务命令或执行MCP。
servers:
- url: /api/v1
paths:
  /admin/settings:
    get:
      operationId: getGlobalSettings
      summary: 读取全局设置
      tags:
      - Admin
      security:
      - AdminBearer: []
      - WebCookie: []
      description: 仅唯一管理员。Cookie写入须CSRF及同源Origin/Referer。三配置为正int64规范十进制字符串，0不表示立即清理、禁用或无限；不新增业务上限。缩短期限只影响后续清理批次；保护未完成/未ACK/failed及必要附件、父消息和有效引用，不承诺永久恢复。
      responses:
        '200':
          description: 完整配置、版本及服务端时间。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettings'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      x-global-settings-policy:
        validation_order:
        - authentication
        - structure-400
        - field-semantics-422
        - expected-version-CAS
        - version-exhaustion
        - atomic-commit
        cookie_write: csrf-and-same-origin-origin-or-referer
        commit: all-values-version-updated_at-and-one-settings.updated-in-one-transaction
        same_values: increment-version-and-emit-one-change
        conflict: 409-GLOBAL_SETTINGS_CONFLICT-latest-version-and-reread
        exhaustion: 409-GLOBAL_SETTINGS_VERSION_EXHAUSTED-retryable-false-no-write-no-event-no-wrap
        recovery: GET-admin-settings-then-reapply-intent-no-blind-replay
      x-cleanup-policy:
        age: UTC-whole-days-since-created_at-safe-day-second-decomposition-no-duration-multiplication-no-cutoff-subtraction-future-never-expired
        schedule: shortening-affects-subsequent-hourly-small-batches-no-immediate-completion
        transaction: recheck-protection-in-delete-transaction
        protect:
        - pending
        - leased
        - retry_wait
        - failed
        - unacknowledged
        - necessary-parent-message-and-attachment
        - other-message-attachment-reference
        - active-download-reference
        ordinary_reference: does-not-permanently-protect-parent-message
        no_ttl: protected-delivery-or-failure-never-silently-dropped-under-pressure
        history: offline-or-unread-does-not-protect-history-no-permanent-recovery-guarantee
    put:
      operationId: updateGlobalSettings
      summary: CAS替换全局设置
      tags:
      - Admin
      security:
      - AdminBearer: []
      - WebCookie: []
        CSRF: []
      description: 仅唯一管理员。Cookie写入须CSRF及同源Origin/Referer。三配置为正int64规范十进制字符串，0不表示立即清理、禁用或无限；不新增业务上限。缩短期限只影响后续清理批次；保护未完成/未ACK/failed及必要附件、父消息和有效引用，不承诺永久恢复。
      responses:
        '200':
          description: 完整配置、版本及服务端时间。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettings'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '409':
          description: 过期CAS优先；匹配但耗尽不可重试，无部分写入或事件。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettingsConflict'
      x-global-settings-policy:
        validation_order:
        - authentication
        - structure-400
        - field-semantics-422
        - expected-version-CAS
        - version-exhaustion
        - atomic-commit
        cookie_write: csrf-and-same-origin-origin-or-referer
        commit: all-values-version-updated_at-and-one-settings.updated-in-one-transaction
        same_values: increment-version-and-emit-one-change
        conflict: 409-GLOBAL_SETTINGS_CONFLICT-latest-version-and-reread
        exhaustion: 409-GLOBAL_SETTINGS_VERSION_EXHAUSTED-retryable-false-no-write-no-event-no-wrap
        recovery: GET-admin-settings-then-reapply-intent-no-blind-replay
      x-cleanup-policy:
        age: UTC-whole-days-since-created_at-safe-day-second-decomposition-no-duration-multiplication-no-cutoff-subtraction-future-never-expired
        schedule: shortening-affects-subsequent-hourly-small-batches-no-immediate-completion
        transaction: recheck-protection-in-delete-transaction
        protect:
        - pending
        - leased
        - retry_wait
        - failed
        - unacknowledged
        - necessary-parent-message-and-attachment
        - other-message-attachment-reference
        - active-download-reference
        ordinary_reference: does-not-permanently-protect-parent-message
        no_ttl: protected-delivery-or-failure-never-silently-dropped-under-pressure
        history: offline-or-unread-does-not-protect-history-no-permanent-recovery-guarantee
      requestBody:
        required: true
        x-max-bytes: 262144
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalSettingsUpdate'
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '401':
        - AUTHENTICATION_REQUIRED
        '403':
        - FORBIDDEN
        '409':
        - GLOBAL_SETTINGS_CONFLICT
        - GLOBAL_SETTINGS_VERSION_EXHAUSTED
        '413':
        - REQUEST_TOO_LARGE
        '422':
        - VALIDATION_FAILED
  /health/live:
    get:
      operationId: getHealthLive
      summary: 公开根健康存活探针
      description: 根路径，覆盖全局/api/v1；已存在Go处理器。ready仅由数据库/挂载Probe决定；未接入、失败、超时或停止为503，FCM不可用仅降级。此声明不证明存储Probe已接入。
      servers:
      - url: /
      security: []
      x-health-policy:
        live: process-only
        ready: database-and-mount-probe
        unready:
        - probe-absent
        - probe-failed
        - probe-timeout
        - stopping
        push_failure: degraded-not-unready
        public_detail: fixed-text-only
      responses:
        '200':
          description: 进程存活/已就绪
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/HealthOK'
              example: "ok\n"
  /health/ready:
    get:
      operationId: getHealthReady
      summary: 公开根健康就绪探针
      description: 根路径，覆盖全局/api/v1；已存在Go处理器。ready仅由数据库/挂载Probe决定；未接入、失败、超时或停止为503，FCM不可用仅降级。此声明不证明存储Probe已接入。
      servers:
      - url: /
      security: []
      x-health-policy:
        live: process-only
        ready: database-and-mount-probe
        unready:
        - probe-absent
        - probe-failed
        - probe-timeout
        - stopping
        push_failure: degraded-not-unready
        public_detail: fixed-text-only
      responses:
        '200':
          description: 进程存活/已就绪
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/HealthOK'
              example: "ok\n"
        '503':
          description: 未就绪，不公开探针细节
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            text/plain; charset=utf-8:
              schema:
                $ref: '#/components/schemas/HealthUnavailable'
              example: "unavailable\n"
  /admin/status:
    get:
      operationId: getAdminStatus
      summary: 管理员系统状态脱敏汇总
      description: 仅唯一管理员Bearer或Web Cookie，Bot Token/Webhook/匿名拒绝；只读不需CSRF。只返回汇总允许列表，不提供正文或任意错误串。此路由为待实现契约；汇总读取失败返回受保护JSON
        Error 503，FCM降级仍可返回200。
      security:
      - AdminBearer: []
      - WebCookie: []
      x-management-projection: system-status-metadata-only
      responses:
        '200':
          description: 脱敏状态汇总
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSystemStatus'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
  /client/ws:
    get:
      operationId: connectClientWS
      summary: Android 提交后同步提示 WebSocket
      description: Authorization Bearer 仅当前 Android 设备会话；Web Cookie/Bot/Webhook 不可升级。原生无 Origin 可用，有 Origin
        必须通过服务端配置策略；禁止查询串凭据及业务写入。101无JSON正文，后续frame按WSFrame单独校验。
      security:
      - AdminBearer: []
      x-client-type: android
      x-ws-frame-schema:
        $ref: '#/components/schemas/WSFrame'
      x-ws-policy:
        supported_major: 1
        origin: native-absent-allowed-present-must-pass-configured-origin-policy
        authentication: current-android-device-session-before-upgrade-no-query-credentials
        upgrade: http-101-no-json-body-frames-validated-separately
        events: hello-first-latest-committed-change_seq-rest-hints-only-no-business-writes
        ping_seconds: 25
        no_response_timeout_seconds: 75
        heartbeat: websocket-control-ping-pong-not-json-events
        slow_client: coalesce-latest-changes_available-bounded-no-body-buffer
        reconnect: exponential-with-jitter-cap-60-seconds
        background: close
        foreground: immediate-single-flight-rest-sync
        window:
        - connect-cache-hints-then-catch-up-from-persisted-cursor
        - sync-then-recheck-hello-high-watermark
        cursor: only-rest-batch-and-cursor-atomic-commit-never-hello-or-hints
        recovery: epoch-mismatch-or-below-floor-rest-410-rebuild-bootstrap-verify-before-generation-switch
        revoked: stop-sync-close-clear-session-no-cached-body-display
        unknown_optional: ignore-only-unknown-optional-event-on-compatible-major
        incompatible_major: explicit-failure-close-no-frame-application
      parameters:
      - name: Origin
        in: header
        required: false
        schema:
          type: string
          format: uri
      - name: Upgrade
        in: header
        required: true
        schema:
          type: string
          const: websocket
      - name: Connection
        in: header
        required: true
        schema:
          type: string
          const: Upgrade
      - name: Sec-WebSocket-Version
        in: header
        required: true
        schema:
          type: string
          const: '13'
      - name: Sec-WebSocket-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9+/]{22}==$
      responses:
        '101':
          description: 升级成功；无HTTP JSON正文。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Upgrade:
              schema:
                type: string
                const: websocket
            Connection:
              schema:
                type: string
                const: Upgrade
            Sec-WebSocket-Accept:
              schema:
                type: string
                pattern: ^[A-Za-z0-9+/]{27}=$
              description: 按握手请求key计算；Schema只验证形状，不证明真实握手。
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      x-error-codes:
        '400':
        - INVALID_WS_HANDSHAKE
        '401':
        - AUTHENTICATION_REQUIRED
        '403':
        - FORBIDDEN
  /auth/login:
    post:
      operationId: login
      summary: 登录唯一管理员
      description: Web 只返回 Cookie 和 CSRF；Android 返回设备会话 Bearer。登录验证同源 Origin；Cookie HttpOnly、SameSite=Lax，外部 HTTPS
        时 Secure。响应及日志不得泄露密码；凭据错误统一 401 AUTHENTICATION_FAILED。
      security: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 仅 Web 登录设置 relaynest_session；HttpOnly; SameSite=Lax; Path=/api/v1；外部 HTTPS 时 Secure。Android
                不设置。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /devices:
    get:
      operationId: listDeviceSessions
      summary: 设备会话元数据列表
      description: 列出当前管理员的有效Web/Android设备会话，复用Session；不返回任何凭据、密码摘要、CSRF或provider token。id用于精确撤销定位，device_id仅为设备元数据，同device_id可有多个有效Session；id是不可复用的会话身份/代次；每次重新登录生成新id，不用客户端时间判代次。
      security:
      - AdminBearer: []
      - WebCookie: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSessionPage'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
        '400':
          $ref: '#/components/responses/400'
      parameters:
      - name: cursor
        in: query
        schema:
          $ref: '#/components/schemas/OpaqueCursor'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
        description: 有界分页；服务端资源控制限制实际页大小，客户端沿 next_cursor 继续。
      x-device-session-policy:
        identity: Session.id-exact-target-and-generation
        generation: new-session-id-every-login-never-reuse
        scope: current-administrator-active-sessions-only
        cookie_write: csrf-and-same-origin-origin-or-referer
        revoke: atomic-entire-target-session-all-providers-and-ws
        late_callback: reject-revoked-or-mismatched-session-id-before-commit
        logout: current-session-only-other-devices-and-bot-credentials-unchanged
  /devices/{id}/session:
    delete:
      operationId: revokeDeviceSession
      summary: 撤销指定设备会话
      description: id路径参数为列表条目的Session.id，device_id仅为元数据，不能作为替代选择键。先鉴权并在提交前重新验证；仅当前管理员有权目标，未知/其他管理员会话统一404
        RESOURCE_NOT_FOUND。事务内仅按所给Session.id定位有效会话，在提交前复核归属与有效性，撤销整个会话及所有provider映射，阻止新发送，关闭其全部WS（沿session_revoked）；旧提示不得展示缓存正文。操作只作用于所给Session.id代次，同device_id其他有效会话保持；迟到或重试DELETE旧id绝不回退选择新会话，迟到provider回调/在途结果提交前必须比对会话身份与有效性，不得复活旧映射或改写重新登录的新代次。重新登录必须生成新Session.id；device_id可保持。logout仍仅撤销当前会话，不影响其他设备或Bot凭据。Cookie写须CSRF及同源Origin/Referer，Bearer无需CSRF。无请求体；204无正文。对已无有效会话目标返回404；重试前可重新列表，不承诺跨重新登录重试幂等。
      security:
      - AdminBearer: []
      - WebCookie: []
        CSRF: []
      responses:
        '204':
          description: 目标会话已撤销；无正文。若撤销自身Web会话，清除relaynest_session Cookie。
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 仅撤销自身Web会话时清除relaynest_session（Max-Age=0）；其他目标或Android不设置。
              schema:
                type: string
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: 目标列表条目的Session.id；device_id或provider标识不能替代。
      x-error-codes:
        '401':
        - AUTHENTICATION_REQUIRED
        '403':
        - FORBIDDEN
        '404':
        - RESOURCE_NOT_FOUND
      x-device-session-policy:
        identity: Session.id-exact-target-and-generation
        generation: new-session-id-every-login-never-reuse
        scope: current-administrator-active-sessions-only
        cookie_write: csrf-and-same-origin-origin-or-referer
        revoke: atomic-entire-target-session-all-providers-and-ws
        late_callback: reject-revoked-or-mismatched-session-id-before-commit
        logout: current-session-only-other-devices-and-bot-credentials-unchanged
  /auth/session:
    get:
      operationId: getSession
      summary: 当前会话及 Web CSRF bootstrap
      description: 当前会话及 Web CSRF bootstrap
      security:
      - AdminBearer: []
      - WebCookie: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
  /auth/logout:
    post:
      operationId: logout
      summary: 仅注销当前管理员会话
      description: 撤销当前会话及推送映射，关闭对应连接；不影响其他设备及任何 Bot 凭据。Web 清除会话 Cookie。
      security:
      - AdminBearer: []
      - WebCookie: []
        CSRF: []
      responses:
        '204':
          description: 成功
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: Web 清除 relaynest_session（Max-Age=0）；Android 不设置。
              schema:
                type: string
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
  /admin/bots:
    get:
      operationId: listBots
      summary: Bot 元数据列表
      description: Bot 元数据列表
      security:
      - AdminBearer: []
      - WebCookie: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: cursor
        in: query
        schema:
          $ref: '#/components/schemas/OpaqueCursor'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
        description: 有界分页；服务端资源控制限制实际页大小，客户端沿 next_cursor 继续。
