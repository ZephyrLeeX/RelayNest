openapi: 3.1.0
info:
  title: RelayNest 核心 API
  version: 1.0.0
  description: P03-04～05：认证/Bot与消息、独立callback、标准Webhook、附件及客户端历史契约。仅契约，不代表运行时路由已实现；P03-06～07继续投递/同步/设备。JSON拒绝未知字段，受保护响应no-store。Web仅管理元数据，无正文/附件/历史；Hub不解释业务命令或执行MCP。
servers:
- url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      summary: 登录唯一管理员
      description: Web 只返回 Cookie 和 CSRF；Android 返回设备会话 Bearer。登录验证同源 Origin；Cookie HttpOnly、SameSite=Lax，外部 HTTPS
        时 Secure。响应及日志不得泄露密码；凭据错误统一 401 AUTHENTICATION_FAILED。
      security: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 仅 Web 登录设置 relaynest_session；HttpOnly; SameSite=Lax; Path=/api/v1；外部 HTTPS 时 Secure。Android
                不设置。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/session:
    get:
      operationId: getSession
      summary: 当前会话及 Web CSRF bootstrap
      description: 当前会话及 Web CSRF bootstrap
      security:
      - AdminBearer: []
      - WebCookie: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
  /auth/logout:
    post:
      operationId: logout
      summary: 仅注销当前管理员会话
      description: 撤销当前会话及推送映射，关闭对应连接；不影响其他设备及任何 Bot 凭据。Web 清除会话 Cookie。
      security:
      - AdminBearer: []
      - WebCookie: []
        CSRF: []
      responses:
        '204':
          description: 成功
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: Web 清除 relaynest_session（Max-Age=0）；Android 不设置。
              schema:
                type: string
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
  /admin/bots:
    get:
      operationId: listBots
      summary: Bot 元数据列表
      description: Bot 元数据列表
      security:
      - AdminBearer: []
      - WebCookie: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: cursor
        in: query
        schema:
          $ref: '#/components/schemas/OpaqueCursor'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
        description: 有界分页；服务端资源控制限制实际页大小，客户端沿 next_cursor 继续。
    post:
      operationId: createBot
      summary: 创建 Bot 并一次返回两套独立凭据
      description: 创建 Bot 并一次返回两套独立凭据
      security:
      - AdminBearer: []
      - WebCookie: []
        CSRF: []
      responses:
        '201':
          description: 成功
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedBotResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBotRequest'
  /admin/bots/{id}:
    patch:
      operationId: patchBot
      summary: 修改 Bot 名称、启停及能力
      description: 修改 Bot 名称、启停及能力
      security:
      - AdminBearer: []
      - WebCookie: []
        CSRF: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBotRequest'
    delete:
      operationId: deleteBot
      summary: 二次确认后永久删除 Bot
      description: 二次确认后永久删除 Bot
      security:
      - AdminBearer: []
      - WebCookie: []
        CSRF: []
      responses:
        '204':
          description: 成功
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteBotRequest'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
  /admin/bots/{id}/credentials/api-token/reset:
    post:
      operationId: resetAPIToken
      summary: 仅重置 Bot API Token
      description: 旧 API Token 在提交后立即失效，取消旧 Long Polling、撤销旧租约并重新排队；消息/失败记录保留，不影响 Webhook Key。新值仅本响应显示一次。
      security:
      - AdminBearer: []
      - WebCookie: []
        CSRF: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedAPIToken'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
  /admin/bots/{id}/credentials/webhook-key/reset:
    post:
      operationId: resetWebhookKey
      summary: 仅重置入站 Webhook Key
      description: 旧 Webhook Key 在提交后立即失效，不影响 API Token、API 租约、消息或失败记录。新值仅本响应显示一次。
      security:
      - AdminBearer: []
      - WebCookie: []
        CSRF: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              description: 受保护响应固定 no-store。
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedWebhookKey'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
  /bot/messages:
    post:
      operationId: createBotMessage
      summary: 创建本 Bot 应用消息
      description: 仅启用 Bot 的 send 能力，sender 固定 application。所有资源引用（回复、附件、消息、按钮）均须在当前 Bot 授权域内验证；跨 Bot 或无权资源404 RESOURCE_NOT_FOUND，不泄露是否存在。附件仅
        ready 可绑定；同一附件 ID 不得重复、kind 必须匹配。受保护响应与日志不泄露非授权正文/附件/路径。Bot 凭据访问须校验启用状态；写入提交前复验身份及凭据代次。
      security:
      - BotAPIToken: []
      responses:
        '201':
          description: 成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 受保护响应固定 no-store。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '410':
          $ref: '#/components/responses/410'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        x-max-bytes: 262144
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
        description: JSON 原始请求体最多256 KiB，超过返回413；未知字段/结构错误400，字段语义422。文本/callback UTF-8字节及数量限制另行校验。
      x-bot-capability: send
      x-reference-policy: same-bot-authorized-ready
  /webhooks/{bot_id}:
    post:
      operationId: createWebhookMessage
      summary: 创建本 Bot 应用消息
      description: 独立 WebhookKey 仅向路径指定且匹配凭据的启用 Bot 创建标准消息，sender 固定 application；不提供字段转换、模板、脚本、读/编辑/上传能力。可绑定本 Bot
        已准备且允许发送的附件；外部链接不自动抓取。所有资源引用（回复、附件、消息、按钮）均须在当前 Bot 授权域内验证；跨 Bot 或无权资源404 RESOURCE_NOT_FOUND，不泄露是否存在。附件仅
        ready 可绑定；同一附件 ID 不得重复、kind 必须匹配。受保护响应与日志不泄露非授权正文/附件/路径。Bot 凭据访问须校验启用状态；写入提交前复验身份及凭据代次。
      security:
      - WebhookKey: []
      responses:
        '201':
          description: 成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 受保护响应固定 no-store。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '410':
          $ref: '#/components/responses/410'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: bot_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: ''
      requestBody:
        required: true
        x-max-bytes: 262144
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
        description: JSON 原始请求体最多256 KiB，超过返回413；未知字段/结构错误400，字段语义422。文本/callback UTF-8字节及数量限制另行校验。
      x-bot-capability: webhook-create-only
      x-reference-policy: same-bot-authorized-ready
  /bot/messages/{id}:
    patch:
      operationId: editBotMessage
      summary: CAS 编辑自身应用消息
      description: 仅启用 Bot send，拒绝编辑 administrator 或其他 Bot 消息。409 REVISION_CONFLICT 不覆盖内容；缺失或无权404。编辑不改变 bot_seq/创建时间/未读/提醒；旧
        callback 保持点击时快照。所有资源引用（回复、附件、消息、按钮）均须在当前 Bot 授权域内验证；跨 Bot 或无权资源404 RESOURCE_NOT_FOUND，不泄露是否存在。附件仅 ready
        可绑定；同一附件 ID 不得重复、kind 必须匹配。受保护响应与日志不泄露非授权正文/附件/路径。Bot 凭据访问须校验启用状态；写入提交前复验身份及凭据代次。
      security:
      - BotAPIToken: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 受保护响应固定 no-store。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '410':
          $ref: '#/components/responses/410'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: ''
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        x-max-bytes: 262144
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageRequest'
        description: JSON 原始请求体最多256 KiB，超过返回413；未知字段/结构错误400，字段语义422。文本/callback UTF-8字节及数量限制另行校验。
      x-bot-capability: send
      x-reference-policy: same-bot-authorized-ready
  /client/bots/{id}/messages:
    post:
      operationId: createClientMessage
      summary: 发送消息
      description: 仅 Android 会话向启用且 receive 的 Bot 发送普通消息，sender 固定 administrator；同事务创建 message.created 应用事件和投递。所有资源引用（回复、附件、消息、按钮）均须在当前
        Bot 授权域内验证；跨 Bot 或无权资源404 RESOURCE_NOT_FOUND，不泄露是否存在。附件仅 ready 可绑定；同一附件 ID 不得重复、kind 必须匹配。受保护响应与日志不泄露非授权正文/附件/路径。Bot
        凭据访问须校验启用状态；写入提交前复验身份及凭据代次。
      security:
      - AdminBearer: []
      responses:
        '201':
          description: 成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 受保护响应固定 no-store。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientMessageReceipt'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '410':
          $ref: '#/components/responses/410'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: ''
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        x-max-bytes: 262144
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
        description: JSON 原始请求体最多256 KiB，超过返回413；未知字段/结构错误400，字段语义422。文本/callback UTF-8字节及数量限制另行校验。
      x-client-type: android
      x-target-bot-capability: receive
      x-reference-policy: same-bot-authorized-ready
    get:
      operationId: listClientMessages
      summary: 获取授权消息历史/详情
      description: 仅 Android Bearer；Web Cookie 不可访问正文。管理员可查看停用 Bot 的仍存历史；不存在/过期或无权404 RESOURCE_NOT_FOUND。所有资源引用（回复、附件、消息、按钮）均须在当前
        Bot 授权域内验证；跨 Bot 或无权资源404 RESOURCE_NOT_FOUND，不泄露是否存在。附件仅 ready 可绑定；同一附件 ID 不得重复、kind 必须匹配。受保护响应与日志不泄露非授权正文/附件/路径。Bot
        凭据访问须校验启用状态；写入提交前复验身份及凭据代次。
      security:
      - AdminBearer: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 受保护响应固定 no-store。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '410':
          $ref: '#/components/responses/410'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: ''
      - name: cursor
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OpaqueCursor'
        description: 本 Bot 历史 bot_seq 边界；首屏省略。
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: 有界页大小，服务端按资源限制处理；不使用offset。
      x-client-type: android
  /client/bots/{id}/callbacks:
    post:
      operationId: createCallback
      summary: 提交独立按钮事件
      description: 仅 Android 会话向启用且 receive 的 Bot 点击 callback 按钮。父消息非当前版本或按钮已不存在/不再是callback时409 BUTTON_STALE；Bot停用409
        BOT_DISABLED，无receive能力403。独立生成button.callback，不生成可见聊天消息。业务授权/时效/重复执行由接入应用判断。所有资源引用（回复、附件、消息、按钮）均须在当前 Bot
        授权域内验证；跨 Bot 或无权资源404 RESOURCE_NOT_FOUND，不泄露是否存在。附件仅 ready 可绑定；同一附件 ID 不得重复、kind 必须匹配。受保护响应与日志不泄露非授权正文/附件/路径。Bot
        凭据访问须校验启用状态；写入提交前复验身份及凭据代次。
      security:
      - AdminBearer: []
      responses:
        '201':
          description: 成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 受保护响应固定 no-store。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackReceipt'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '410':
          $ref: '#/components/responses/410'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: ''
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        x-max-bytes: 262144
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
        description: JSON 原始请求体最多256 KiB，超过返回413；未知字段/结构错误400，字段语义422。文本/callback UTF-8字节及数量限制另行校验。
      x-client-type: android
      x-target-bot-capability: receive
      x-reference-policy: same-bot-authorized-ready
  /client/messages/{id}:
    get:
      operationId: getClientMessage
      summary: 获取授权消息历史/详情
      description: 仅 Android Bearer；Web Cookie 不可访问正文。管理员可查看停用 Bot 的仍存历史；不存在/过期或无权404 RESOURCE_NOT_FOUND。所有资源引用（回复、附件、消息、按钮）均须在当前
        Bot 授权域内验证；跨 Bot 或无权资源404 RESOURCE_NOT_FOUND，不泄露是否存在。附件仅 ready 可绑定；同一附件 ID 不得重复、kind 必须匹配。受保护响应与日志不泄露非授权正文/附件/路径。Bot
        凭据访问须校验启用状态；写入提交前复验身份及凭据代次。
      security:
      - AdminBearer: []
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 受保护响应固定 no-store。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '410':
          $ref: '#/components/responses/410'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: ''
      x-client-type: android
  /attachments:
    post:
      operationId: uploadAttachment
      summary: 单文件流式上传
      description: 仅Android管理员或启用Bot send；Web Cookie/Webhook/receive-only不可上传。bot_id 必须在身份授权范围内；管理员目标 bot_id 必须存在且已授权。图片默认10MiB、文件50MiB，按全局配置生效；检查实际流字节，超限413，不信任Content-Length。随机物理文件名、SHA-256、fsync/同卷rename及DB
        ready成功后才201；DB失败不宣称成功。未完成staging可安全重试，同键完成上传返回原附件，半文件不作成功；空闲未引用staging/ready 24小时后回收，活动上传保护。非分片上传协议。所有资源引用（回复、附件、消息、按钮）均须在当前
        Bot 授权域内验证；跨 Bot 或无权资源404 RESOURCE_NOT_FOUND，不泄露是否存在。附件仅 ready 可绑定；同一附件 ID 不得重复、kind 必须匹配。受保护响应与日志不泄露非授权正文/附件/路径。Bot
        凭据访问须校验启用状态；写入提交前复验身份及凭据代次。
      security:
      - AdminBearer: []
      - BotAPIToken: []
      responses:
        '201':
          description: 成功
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 受保护响应固定 no-store。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '410':
          $ref: '#/components/responses/410'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: bot_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: ''
      - name: kind
        in: query
        required: true
        schema:
          enum:
          - image
          - file
        description: ''
      - name: filename
        in: query
        required: true
        schema:
          type: string
          minLength: 1
        description: 原始显示文件名；不得作为物理路径。
      - name: media_type
        in: query
        required: true
        schema:
          type: string
          minLength: 1
        description: 显示MIME，服务端校验/安全处理；不凭此放宽图片或文件实际字节限制。
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: 单文件原始二进制流；不是JSON/base64或multipart分片协议。
        x-default-max-bytes:
          image: 10485760
          file: 52428800
        x-configurable-max-bytes: true
      x-client-type: android-or-bot
      x-bot-capability: send
      x-reference-policy: same-bot-authorized-ready
  /attachments/{id}:
    get:
      operationId: downloadAttachment
      summary: 权限下载与断点传输
      description: 仅Android管理员或启用Bot API下载ready授权附件。Bot send仅本Bot获准发送消息附件；receive仅已领取事件所需附件，不能枚举历史。Web Cookie/Webhook无权；管理员仍可下载停用Bot授权历史。先取得下载引用/短租约再打开，清理不能删除活动文件；ready缺文件返回404
        ATTACHMENT_MISSING并记录健康异常。先鉴权后处理条件与范围，错误不泄露资源大小。支持单/多字节范围，不能满足416；格式非法400。所有资源引用（回复、附件、消息、按钮）均须在当前 Bot 授权域内验证；跨
        Bot 或无权资源404 RESOURCE_NOT_FOUND，不泄露是否存在。附件仅 ready 可绑定；同一附件 ID 不得重复、kind 必须匹配。受保护响应与日志不泄露非授权正文/附件/路径。Bot
        凭据访问须校验启用状态；写入提交前复验身份及凭据代次。
      security:
      - AdminBearer: []
      - BotAPIToken: []
      responses:
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '410':
          $ref: '#/components/responses/410'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
        '200':
          description: 完整内容
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 受保护响应固定 no-store。
            ETag:
              schema:
                $ref: '#/components/schemas/StrongETag'
              description: ready 内容强ETag。
            Accept-Ranges:
              schema:
                type: string
                const: bytes
              description: 支持字节范围。
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
              description: 禁止浏览器MIME嗅探。
            Content-Disposition:
              schema:
                type: string
              description: 安全attachment及经过转义的filename/filename*；拒绝CR/LF注入，不含物理路径。
            Content-Length:
              schema:
                type: integer
                minimum: 0
              description: 实际响应体字节数，多区间包括边界与各部分头部。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: 单区间或多区间内容；多区间每部分均含Content-Range和Content-Type。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 受保护响应固定 no-store。
            ETag:
              schema:
                $ref: '#/components/schemas/StrongETag'
              description: ready 内容强ETag。
            Accept-Ranges:
              schema:
                type: string
                const: bytes
              description: 支持字节范围。
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
              description: 禁止浏览器MIME嗅探。
            Content-Disposition:
              schema:
                type: string
              description: 安全attachment及经过转义的filename/filename*；拒绝CR/LF注入，不含物理路径。
            Content-Length:
              schema:
                type: integer
                minimum: 0
              description: 实际响应体字节数，多区间包括边界与各部分头部。
            Content-Range:
              schema:
                allOf:
                - $ref: '#/components/schemas/ContentRange'
                - type: string
                  pattern: ^bytes [0-9]+-[0-9]+/[0-9]+$
              description: 单区间必须返回；多区间由各part携带，不在顶层返回。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            multipart/byteranges:
              schema:
                type: string
                format: binary
        '304':
          description: If-None-Match 匹配，无响应体。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 受保护响应固定 no-store。
            ETag:
              schema:
                $ref: '#/components/schemas/StrongETag'
              description: ready 内容强ETag。
            Accept-Ranges:
              schema:
                type: string
                const: bytes
              description: 支持字节范围。
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
              description: 禁止浏览器MIME嗅探。
        '416':
          description: RANGE_NOT_SATISFIABLE；所有范围不满足实际资源。只对已经授权且ready文件返回大小。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: 受保护响应固定 no-store。
            Content-Range:
              schema:
                allOf:
                - $ref: '#/components/schemas/ContentRange'
                - type: string
                  pattern: ^bytes \*/[0-9]+$
              description: 必须为 bytes */size。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: ''
      - name: Range
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/ByteRanges'
        description: ''
      - name: If-Range
        in: header
        required: false
        schema:
          type: string
        description: 强ETag或HTTP日期；匹配时按Range，不匹配/弱ETag则忽略Range返回完整200。
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
        description: 匹配当前ETag返回304；优先于Range。
      x-client-type: android-or-bot
      x-bot-capability: send-authorized-or-receive-claimed-event
      x-reference-policy: same-bot-authorized-ready
components:
  schemas:
    ID:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      description: 服务端 UUID v4；ID 本身不授予访问权限。
      maxLength: 36
    Sequence:
      type: string
      pattern: ^(0|[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
      description: SQLite 非负 64 位序号的规范十进制字符串；禁止数字、前导零及指数形式。bot_seq/change_seq/read_seq 不可互换。
      not:
        pattern: '[^0-9]'
    Version:
      type: integer
      minimum: 1
      description: 从 1 开始的实体版本；不等于序号或凭据代次。
    UTCDateTime:
      type: string
      format: date-time
      pattern: Z$
      description: UTC RFC3339 时间。
    OpaqueCursor:
      type: string
      minLength: 1
      description: 不透明分页令牌；客户端原样回传，不推导序号或采用 offset。
    Pagination:
      type: object
      properties:
        next_cursor:
          oneOf:
          - $ref: '#/components/schemas/OpaqueCursor'
          - type: 'null'
        has_more:
          type: boolean
      required:
      - next_cursor
      - has_more
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              pattern: ^[A-Z][A-Z0-9_]*$
              description: 稳定机器码；按 code 分支，不匹配中文 message。后续卡可增加 code。
            message:
              type: string
            request_id:
              type: string
              minLength: 1
            retryable:
              type: boolean
          required:
          - code
          - message
          - request_id
          - retryable
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Capabilities:
      type: object
      properties:
        send:
          type: boolean
        receive:
          type: boolean
      required:
      - send
      - receive
      additionalProperties: false
      description: Bot API 授权能力。send 可创建/编辑自身 application 消息并上传附件；receive 可 claim/ACK/renew 及下载对应投递附件；不能管理 Bot 或跨
        Bot。停用覆盖两项授权。
    LoginRequest:
      oneOf:
      - type: object
        properties:
          username:
            type: string
            minLength: 1
          password:
            type: string
            minLength: 1
            writeOnly: true
          client_type:
            const: web
          device_name:
            type: string
            minLength: 1
        required:
        - username
        - password
        - client_type
        - device_name
        additionalProperties: false
      - type: object
        properties:
          username:
            type: string
            minLength: 1
          password:
            type: string
            minLength: 1
            writeOnly: true
          client_type:
            const: android
          device_name:
            type: string
            minLength: 1
          device_id:
            $ref: '#/components/schemas/ID'
        required:
        - username
        - password
        - client_type
        - device_name
        - device_id
        additionalProperties: false
      description: 唯一管理员，无注册/SSO/RelayShelf 依赖。Android 每安装生成 device_id；Web 登录验证同源 Origin。用户名/密码错误统一返回 401 AUTHENTICATION_FAILED。
    Administrator:
      type: object
      properties:
        username:
          type: string
          minLength: 1
      required:
      - username
      additionalProperties: false
    Session:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        administrator:
          $ref: '#/components/schemas/Administrator'
        client_type:
          enum:
          - web
          - android
        device_id:
          $ref: '#/components/schemas/ID'
        device_name:
          type: string
          minLength: 1
        idle_expires_at:
          $ref: '#/components/schemas/UTCDateTime'
        absolute_expires_at:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - id
      - administrator
      - client_type
      - device_id
      - device_name
      - idle_expires_at
      - absolute_expires_at
      additionalProperties: false
      description: 仅会话元数据，无 Token/密码摘要。有效请求可延长空闲期但不超过绝对期限；过期需重新登录。
    WebSession:
      allOf:
      - $ref: '#/components/schemas/Session'
      - properties:
          client_type:
            const: web
    AndroidSession:
      allOf:
      - $ref: '#/components/schemas/Session'
      - properties:
          client_type:
            const: android
    WebSessionResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/WebSession'
        csrf_token:
          type: string
          minLength: 1
      required:
      - session
      - csrf_token
      additionalProperties: false
      description: Web CSRF bootstrap；csrf_token 不得写日志。Cookie 会话不在 JSON 中返回。
    AndroidSessionResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/AndroidSession'
      required:
      - session
      additionalProperties: false
    SessionResponse:
      oneOf:
      - $ref: '#/components/schemas/WebSessionResponse'
      - $ref: '#/components/schemas/AndroidSessionResponse'
    AndroidLoginResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/AndroidSession'
        access_token:
          type: string
          minLength: 1
        token_type:
          const: Bearer
      required:
      - session
      - access_token
      - token_type
      additionalProperties: false
      description: 仅 Android 登录成功返回会话 Bearer；后续 GET session 不再返回。
    LoginResponse:
      oneOf:
      - $ref: '#/components/schemas/WebSessionResponse'
      - $ref: '#/components/schemas/AndroidLoginResponse'
    CredentialMetadata:
      type: object
      properties:
        credential_id:
          type: string
          minLength: 1
        generation:
          type: integer
          minimum: 1
      required:
      - credential_id
      - generation
      additionalProperties: false
      description: 公开查找标识与撤销代次，无密钥或摘要。两套凭据独立生成、独立摘要存储，各至少 256 bit 随机。
    BotCredentials:
      type: object
      properties:
        api_token:
          $ref: '#/components/schemas/CredentialMetadata'
        webhook_key:
          $ref: '#/components/schemas/CredentialMetadata'
      required:
      - api_token
      - webhook_key
      additionalProperties: false
    Bot:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        version:
          $ref: '#/components/schemas/Version'
        credentials:
          $ref: '#/components/schemas/BotCredentials'
        connection:
          type: object
          properties:
            state:
              enum:
              - recent_poll
              - unknown
            last_poll_at:
              oneOf:
              - $ref: '#/components/schemas/UTCDateTime'
              - type: 'null'
          required:
          - state
          - last_poll_at
          additionalProperties: false
      required:
      - id
      - name
      - enabled
      - capabilities
      - version
      - credentials
      - connection
      additionalProperties: false
      description: 仅管理元数据；recent_poll 表示近期应用轮询，不承诺业务消费者持续在线；Webhook-only 为 unknown。无正文、附件、历史、callback_data 或原始异常。
    CreateBotRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/Capabilities'
      required:
      - name
      - enabled
      - capabilities
      additionalProperties: false
    PatchBotRequest:
      type: object
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/Capabilities'
      required:
      - expected_version
      additionalProperties: false
      description: 版本比较防覆盖；停用/授权变更按提交前重新鉴权，停用不清空队列。
    DeleteBotRequest:
      type: object
      properties:
        confirm_name:
          type: string
          minLength: 1
        expected_version:
          $ref: '#/components/schemas/Version'
      required:
      - confirm_name
      - expected_version
      additionalProperties: false
      description: UI 二次确认后显式提交 Bot 名称与当前版本；永久删除凭据/历史/受保护队列，异步回收无引用附件。
    IssuedAPIToken:
      type: object
      properties:
        credential:
          $ref: '#/components/schemas/CredentialMetadata'
        token:
          type: string
          minLength: 1
        capabilities:
          $ref: '#/components/schemas/Capabilities'
      required:
      - credential
      - token
      - capabilities
      additionalProperties: false
      description: 仅创建/重置响应返回明文；绑定本 Bot 的 send/receive 授权；不可替代 Webhook Key。
    IssuedWebhookKey:
      type: object
      properties:
        credential:
          $ref: '#/components/schemas/CredentialMetadata'
        key:
          type: string
          minLength: 1
      required:
      - credential
      - key
      additionalProperties: false
      description: 仅创建/重置返回；仅 Authorization Bearer 用于 POST /webhooks/{bot_id} 创建标准消息。不可用于读、编辑、上传、claim/ACK/renew
        或管理接口。
    CreatedBotResponse:
      type: object
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
        api_token:
          $ref: '#/components/schemas/IssuedAPIToken'
        webhook_key:
          $ref: '#/components/schemas/IssuedWebhookKey'
      required:
      - bot
      - api_token
      - webhook_key
      additionalProperties: false
    BotPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Bot'
        next_cursor:
          oneOf:
          - $ref: '#/components/schemas/OpaqueCursor'
          - type: 'null'
        has_more:
          type: boolean
      required:
      - items
      - next_cursor
      - has_more
      additionalProperties: false
      description: 有界管理元数据分页；不包含任何消息历史。
    MessageText:
      type: string
      maxLength: 65536
      x-utf8-max-bytes: 65536
      description: UTF-8 最多 64 KiB；maxLength 仅为字符数上界，运行时还必须检查编码后的字节数。不截断。
    CallbackData:
      type: string
      maxLength: 4096
      x-utf8-max-bytes: 4096
      description: UTF-8 最多 4 KiB，允许空字符串；逐字保留，不 trim、不解释命令、不记录日志。
    MessageButton:
      oneOf:
      - type: object
        properties:
          id: &id001
            type: string
            minLength: 1
          label: &id002
            type: string
            minLength: 1
            maxLength: 128
          url:
            type: string
            format: uri
            description: 普通外部链接，不自动抓取为附件。
            pattern: '^[A-Za-z][A-Za-z0-9+.-]*:'
            not:
              pattern: '[\x00-\x20\x7f]'
        required:
        - id
        - label
        - url
        additionalProperties: false
      - type: object
        properties:
          id: *id001
          label: *id002
          callback_data:
            $ref: '#/components/schemas/CallbackData'
        required:
        - id
        - label
        - callback_data
        additionalProperties: false
      description: URL 与 callback_data 严格互斥。每消息内 button id 必须唯一，由服务语义校验。
    MessageButtons:
      type: array
      items:
        type: array
        items:
          $ref: '#/components/schemas/MessageButton'
        minItems: 1
        maxItems: 5
      maxItems: 10
    AttachmentReference:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        kind:
          enum:
          - image
          - file
      required:
      - id
      - kind
      additionalProperties: false
    CreateMessageRequest:
      type: object
      properties:
        format: &id003
          enum:
          - plain
          - markdown
        text: &id004
          $ref: '#/components/schemas/MessageText'
        attachments: &id005
          type: array
          items:
            $ref: '#/components/schemas/AttachmentReference'
          maxItems: 10
          uniqueItems: true
        reply_to_message_id: &id006
          oneOf:
          - $ref: '#/components/schemas/ID'
          - type: 'null'
        buttons: &id007
          $ref: '#/components/schemas/MessageButtons'
      required:
      - format
      additionalProperties: false
      anyOf: &id008
      - required:
        - text
        properties:
          text:
            minLength: 1
      - required:
        - attachments
        properties:
          attachments:
            minItems: 1
      - required:
        - buttons
        properties:
          buttons:
            minItems: 1
      description: 标准消息载荷；text/attachments/buttons 省略分别视为空字符串/空数组/空数组，reply 省略视为 null。三类内容至少一类非空；附件 ID 不得重复，kind
        必须符合存储元数据；所有引用和附件均属当前 Bot，附件必须 ready 且身份允许发送。sender、bot_id、revision 由服务生成，调用方不可指定。普通回复保留原引用 ID；源消息自然过期后显示引用已过期，不无限保存正文。
    EditMessageRequest:
      type: object
      properties:
        format: *id003
        text: *id004
        attachments: *id005
        reply_to_message_id: *id006
        buttons: *id007
        expected_revision:
          $ref: '#/components/schemas/Version'
      required:
      - format
      - expected_revision
      additionalProperties: false
      anyOf: *id008
      description: 完整替换当前内容，省略字段按创建时空值处理；不是字段局部合并。仅 Bot send 编辑自身 application 消息。CAS 检查失败返回 409 REVISION_CONFLICT；完整校验后同事务更新正文、revision、附件关系及
        message.updated。bot_seq/created_at 不变，不增加未读、不重新响铃；仅保留当前正文。
    Message:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        bot_id:
          $ref: '#/components/schemas/ID'
        bot_seq:
          $ref: '#/components/schemas/Sequence'
        revision:
          $ref: '#/components/schemas/Version'
        sender:
          enum:
          - application
          - administrator
        format: *id003
        text: *id004
        attachments: *id005
        reply_to_message_id: *id006
        buttons: *id007
        created_at:
          $ref: '#/components/schemas/UTCDateTime'
        updated_at:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - id
      - bot_id
      - bot_seq
      - revision
      - sender
      - format
      - text
      - attachments
      - reply_to_message_id
      - buttons
      - created_at
      - updated_at
      additionalProperties: false
      description: 当前消息快照；sender 由身份确定。仅授权客户端历史/详情、消息写入回执返回正文，不向 Web 管理路由开放。reply_to_message_id 保留原 ID，即使引用自然过期；缺失引用详情以
        404 表示，客户端显示引用已过期。
      anyOf:
      - required:
        - text
        properties:
          text:
            minLength: 1
      - required:
        - attachments
        properties:
          attachments:
            minItems: 1
      - required:
        - buttons
        properties:
          buttons:
            minItems: 1
    ClientMessageReceipt:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/Message'
        delivery_id:
          $ref: '#/components/schemas/ID'
      required:
      - message
      - delivery_id
      additionalProperties: false
      description: 持久化成功才返回；delivery_id 只表示已建立应用投递，不表示业务执行完成。
    CallbackRequest:
      type: object
      properties:
        message_id:
          $ref: '#/components/schemas/ID'
        message_revision:
          $ref: '#/components/schemas/Version'
        button_id:
          type: string
          minLength: 1
      required:
      - message_id
      - message_revision
      - button_id
      additionalProperties: false
      description: 点击提交消息/版本/按钮 ID；callback_data 从该版本按钮快照读取，不信任客户端传参。来源管理员和设备由当前 Android 会话确定。
    CallbackReceipt:
      type: object
      properties:
        event_id:
          $ref: '#/components/schemas/ID'
        delivery_id:
          $ref: '#/components/schemas/ID'
        message_id:
          $ref: '#/components/schemas/ID'
        message_revision:
          $ref: '#/components/schemas/Version'
        button_id:
          type: string
          minLength: 1
        callback_data:
          $ref: '#/components/schemas/CallbackData'
        created_at:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - event_id
      - delivery_id
      - message_id
      - message_revision
      - button_id
      - callback_data
      - created_at
      additionalProperties: false
      description: 独立 button.callback 交互回执，不创建可见聊天消息。服务持久化点击时参数快照、管理员身份及来源设备；随后编辑不得改写快照。同一次点击重试复用键，再次点击使用新键；Hub
        不解释业务参数或执行 MCP。
    MessagePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_cursor:
          oneOf:
          - $ref: '#/components/schemas/OpaqueCursor'
          - type: 'null'
        has_more:
          type: boolean
      required:
      - items
      - next_cursor
      - has_more
      additionalProperties: false
      description: 按 bot_seq 从新到旧返回有界历史；cursor 是该 Bot 的不透明 bot_seq 边界，不能跨 Bot 或用 offset。next_cursor 末页为 null；has_more
        与其一致。编辑不改变排序。复用通用分页字段语义，不含同步游标/epoch。
    Attachment:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        bot_id:
          $ref: '#/components/schemas/ID'
        kind:
          enum:
          - image
          - file
        filename:
          type: string
          minLength: 1
        media_type:
          type: string
          minLength: 1
        size:
          $ref: '#/components/schemas/Sequence'
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        state:
          const: ready
        created_at:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - id
      - bot_id
      - kind
      - filename
      - media_type
      - size
      - sha256
      - state
      - created_at
      additionalProperties: false
      description: 仅完整持久化后的 ready 附件；size 为实际字节数十进制字符串，sha256 为内容摘要。不返回物理路径/存储键。原始文件名只作显示；不可拼接存储路径。
    ByteRanges:
      type: string
      pattern: ^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)(?:, *(?:[0-9]+-[0-9]*|-[0-9]+))*$
      x-byte-ranges: true
      description: 字节区间，含闭区间、开放结尾、suffix 及多区间；数字仅 ASCII。显式 start > end 非法（400），相对实际大小全不相交或 suffix=0 返回416；部分相交截至末字节，至少一个可满足时206。资源零字节时所有有效
        Range 均416。
    ContentRange:
      type: string
      pattern: ^bytes (?:[0-9]+-[0-9]+/[0-9]+|\*/[0-9]+)$
      description: 206 单区间为 bytes start-end/size；416 为 bytes */size。区间/长度与真实文件一致，运行时验证。 206 必须满足 0 <= start <= end
        < size；416 为不含区间的 */size。
      x-content-range: true
    StrongETag:
      type: string
      pattern: ^"[0-9a-f]{64}"$
      minLength: 66
      maxLength: 66
      description: ready 文件 SHA-256 的带双引号强 ETag。
  responses:
    '400':
      description: 格式错误
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: 未认证、过期或撤销
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '403':
      description: 越权或 CSRF/同源检查失败
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: 无权或不存在资源
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: 版本冲突
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '410':
      description: 资源或游标过期
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '413':
      description: 请求超限
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '422':
      description: 字段语义错误
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '429':
      description: 限流
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
        Retry-After:
          description: 尽量提供重试等待秒数或 HTTP 日期。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '503':
      description: 存储或暂时不可用
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
        Retry-After:
          description: 尽量提供重试等待秒数或 HTTP 日期。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      description: Android 管理员设备会话；非 JWT，自包含 Token 不能替代可撤销会话。Bot 凭据不能访问管理接口。
    WebCookie:
      type: apiKey
      in: cookie
      name: relaynest_session
      description: Web 管理会话；HttpOnly、SameSite=Lax，外部 HTTPS 时 Secure；同一唯一管理员。
    CSRF:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Web 写操作验证会话 CSRF 及同源 Origin/Referer；不适用于无会话的登录。
    BotAPIToken:
      type: http
      scheme: bearer
      description: 仅本 Bot 的 send/receive 授权；不能用于 /auth、/admin 或 Webhook。
    WebhookKey:
      type: http
      scheme: bearer
      description: 独立、仅发送；仅 POST /webhooks/{bot_id}，禁止在 URL 携带。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: 客户端生成 UUID v4。作用域=管理员或 Bot 身份+路由类别，与 Token 版本无关。规范化摘要含路径目标 Bot/资源 ID、有效字段/附件 ID/引用/按钮，排除 Authorization；编辑含
        expected_revision，callback 含点击目标和版本，上传含目标 Bot/元数据/实际文件摘要。同键同请求返回原状态/结果；不同内容409 IDEMPOTENCY_CONFLICT。编辑重放先恢复原结果，再判断新的
        CAS，防止成功重试误报冲突。存活消息及投递期间保留记录；清理后最小墓碑7天，命中410 RESOURCE_EXPIRED，不重新创建；受保护投递记录不按7天删除。窗口后不承诺去重，客户端不得自动重放未知旧意图。
        重放仍须先验证当前身份/能力/授权；重置后使用新有效凭据恢复，不能以旧已撤销Token换回结果。callback 重放先恢复原交互，再判断新点击的按钮时效。
