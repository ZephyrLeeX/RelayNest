      summary: CAS替换当前设备通知配置
      description: 仅当前有效Android管理员会话。device_id从认证Session取得，不接受目标选择器；偏好属于设备，不因其他设备已读或静音覆盖，同device_id多Session共享配置但注册独立。0为虚拟默认(enabled=true、bot_overrides=[]、DND关闭UTC
        22:00~07:00、preview=false、fcm/fcm)，不产生变更。PUT含全部字段，expected_version不匹配409返回最新版本及恢复路径，先GET再协调；成功在同事务递增配置版本并写时间和typed
        SyncChange，即使值相同也递增，耗尽不部分提交。vendor要求当前会话对应有效注册和服务端已核平台条件，不满足422 PROVIDER_NOT_READY，不自动回退。FCM注册缺失不妨碍保存fcm偏好，数据沿前台/周期补偿，注册成功不会自动切换模式。
      security:
      - AdminBearer: []
      x-client-type: android
      x-notification-settings-policy:
        owner: authenticated-Session.device_id-shared-across-sessions-never-assume-unique-device-session
        registration: Session.id+provider-independent-never-activate-mode
        initial: virtual-version-0-enabled-fcm-preview-false-no-event-time-null
        transaction: reauthenticate-current-session-check-bots-platform-registration-CAS-device-config-version-time-and-sync-change-atomic
        put: full-replacement-match-expected-increment-even-same-value-no-client-time
        conflict: 409-latest_settings_version-recovery_path-GET-before-retry
        exhaustion: 409-no-wrap-no-config-time-event-or-registration-partial-commit
        vendor: explicit-opush-valid-current-session-registration-and-server-verified-platform-otherwise-422-no-fallback
        sync: typed-device.notifications.updated-device_id-filter-strictly-newer-version-GET-current-recovery-no-H-epoch-floor-seed-change
      x-notification-job-policy:
        snapshot: session_id-device_id-purpose-target_watermark-provider-registration_version-settings_version-reminder_key-bot_id-bot_seq-expires_at-alert_eligible
        before: active-exact-session-device-registration-settings-and-mode-lease-device-serial-expiry-then-alert-enabled-bot-DND-unread-existing
        after: same-entire-snapshot-current-registration-config-active-session-and-live-lease-CAS-old-result-noop
        merge: sync-watermark-max-only-alert-eligibility-and-original-version-key-expiry-never-revive
        switch: future-new-events-only-stop-old-version-new-sends-isolate-inflight-no-cross-provider-timeout-retry
        dnd: drop-alert-eligibility-during-device-timezone-window-no-end-replay-sync-continues
        result: accepted-is-not-ACK-unknown-preserves-registration-no-cross-channel-resound
        vendor_text:
          title: RelayNest 有新消息
          content: 打开 RelayNest 同步查看
        fcm: data-only-hint-self-render-after-authoritative-sync-dedup-deployment-message-read-preview-DND-no-vendor-exemptions
        vendor_limit: only-vendor-accepted-offline-DND-read-delete-logout-switch-retraction-limit
        convergence: latest-confirmed-config-no-stale-fcm-resound-allowed-missed-alert-data-compensates
      responses:
        '200':
          description: 当前设备完整配置及服务端时间。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsState'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
        '404':
          $ref: '#/components/responses/404'
        '413':
          $ref: '#/components/responses/413'
        '422':
          $ref: '#/components/responses/422'
        '409':
          description: 配置冲突或版本耗尽；重新读取，禁止盲重放旧意图。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsConflict'
      x-error-codes:
        '401':
        - AUTHENTICATION_REQUIRED
        '403':
        - FORBIDDEN
        '404':
        - RESOURCE_NOT_FOUND
        '409':
        - SETTINGS_CONFLICT
        - SETTINGS_VERSION_EXHAUSTED
        '422':
        - VALIDATION_FAILED
        - PROVIDER_NOT_READY
      requestBody:
        required: true
        x-max-bytes: 262144
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettingsUpdate'
components:
  schemas:
    GlobalSettingsValue:
      allOf:
      - $ref: '#/components/schemas/Sequence'
      - not:
          const: '0'
      description: 正 int64 规范十进制字符串，1～9223372036854775807；禁止0、前导零、符号、小数、指数和JSON数字。仅为表示/存储技术上限，无额外业务上限。
    GlobalSettingsVersion:
      allOf:
      - $ref: '#/components/schemas/Version'
      - maximum: 9007199254740991
      description: 全局设置专用JSON整数版本，1～9007199254740991；不改变公共或设备Version。
    GlobalSettings:
      type: object
      properties:
        retention_days:
          $ref: '#/components/schemas/GlobalSettingsValue'
          default: '30'
        image_max_bytes:
          $ref: '#/components/schemas/GlobalSettingsValue'
          default: '10485760'
        file_max_bytes:
          $ref: '#/components/schemas/GlobalSettingsValue'
          default: '52428800'
        version:
          $ref: '#/components/schemas/GlobalSettingsVersion'
        updated_at:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - retention_days
      - image_max_bytes
      - file_max_bytes
      - version
      - updated_at
      additionalProperties: false
      description: 完整全局设置；初始持久化版本1，updated_at由服务端生成。默认30天、10MiB、50MiB均可调。
    GlobalSettingsUpdate:
      type: object
      properties:
        retention_days:
          $ref: '#/components/schemas/GlobalSettingsValue'
          default: '30'
        image_max_bytes:
          $ref: '#/components/schemas/GlobalSettingsValue'
          default: '10485760'
        file_max_bytes:
          $ref: '#/components/schemas/GlobalSettingsValue'
          default: '52428800'
        expected_version:
          $ref: '#/components/schemas/GlobalSettingsVersion'
      required:
      - retention_days
      - image_max_bytes
      - file_max_bytes
      - expected_version
      additionalProperties: false
    GlobalSettingsConflict:
      oneOf:
      - type: object
        properties:
          error:
            type: object
            properties:
              code:
                const: GLOBAL_SETTINGS_CONFLICT
              message:
                type: string
              request_id:
                type: string
                minLength: 1
              retryable:
                const: false
              latest_version:
                $ref: '#/components/schemas/GlobalSettingsVersion'
              recovery_path:
                const: /admin/settings
            required:
            - code
            - message
            - request_id
            - retryable
            - latest_version
            - recovery_path
            additionalProperties: false
        required:
        - error
        additionalProperties: false
      - type: object
        properties:
          error:
            type: object
            properties:
              code:
                const: GLOBAL_SETTINGS_VERSION_EXHAUSTED
              message:
                type: string
              request_id:
                type: string
                minLength: 1
              retryable:
                const: false
              latest_version:
                allOf:
                - $ref: '#/components/schemas/GlobalSettingsVersion'
                - const: 9007199254740991
              recovery_path:
                const: /admin/settings
            required:
            - code
            - message
            - request_id
            - retryable
            - latest_version
            - recovery_path
            additionalProperties: false
        required:
        - error
        additionalProperties: false
      description: 先CAS再耗尽：过期即CONFLICT；匹配且达到上限为VERSION_EXHAUSTED。重读最新配置；禁止盲重放。耗尽不可重试，GET仍可用，恢复写入需未来明确迁移。
    SyncGlobalSettings:
      type: object
      properties:
        type:
          const: settings.updated
        change_seq:
          $ref: '#/components/schemas/Sequence'
        settings_version:
          $ref: '#/components/schemas/GlobalSettingsVersion'
        recovery_path:
          const: /admin/settings
      required:
      - type
      - change_seq
      - settings_version
      - recovery_path
      additionalProperties: false
      description: 仅传全局配置版本及管理GET关联，不携带配置正文；正文仍需管理员权限。仅更高版本触发重读，重复/旧版本忽略投影但正常提交同步游标；GET旧响应不得覆盖较新版本。与device.notifications.updated独立。
    HealthOK:
      type: string
      const: "ok\n"
    HealthUnavailable:
      type: string
      const: "unavailable\n"
    StatusCount:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: 汇总计数的JSON安全整数上限，不是队列容量限制；超出时不得返回失真值。
    QueueStatus:
      type: object
      properties:
        pending:
          $ref: '#/components/schemas/StatusCount'
        leased:
          $ref: '#/components/schemas/StatusCount'
        retry_wait:
          $ref: '#/components/schemas/StatusCount'
        failed:
          $ref: '#/components/schemas/StatusCount'
        oldest_waiting_at:
          oneOf:
          - $ref: '#/components/schemas/UTCDateTime'
          - type: 'null'
      required:
      - pending
      - leased
      - retry_wait
      - failed
      - oldest_waiting_at
      additionalProperties: false
      allOf:
      - if:
          properties:
            pending:
              const: 0
            retry_wait:
              const: 0
        then:
          properties:
            oldest_waiting_at:
              type: 'null'
        else:
          properties:
            oldest_waiting_at:
              $ref: '#/components/schemas/UTCDateTime'
      description: 应用投递全局汇总，含停用Bot的保留队列；failed计失败投递，不计业务命令结果。最旧等待取pending/retry_wait最早入队时刻，未等待为null，leased不计等待。
    ConnectionStatus:
      type: object
      properties:
        ws_online_sessions:
          $ref: '#/components/schemas/StatusCount'
        recent_poll_bots:
          $ref: '#/components/schemas/StatusCount'
        unknown_bots:
          $ref: '#/components/schemas/StatusCount'
        webhook_state:
          const: unknown
      required:
      - ws_online_sessions
      - recent_poll_bots
      - unknown_bots
      - webhook_state
      additionalProperties: false
      description: WS计当前有效管理员会话连接；recent_poll/unknown按应用Bot汇总，遵循既有Bot.connection判定，不新增近期阈值。Webhook-only计入unknown，webhook_state永远unknown；WS在线不代表应用消费者或Webhook持续在线。
    AttachmentRecoveryStatus:
      type: object
      properties:
        anomaly_count:
          $ref: '#/components/schemas/StatusCount'
        last_error_code:
          enum:
          - null
          - ATTACHMENT_RECOVERY_FAILED
          - ATTACHMENT_STORAGE_UNAVAILABLE
          - ATTACHMENT_OTHER
      required:
      - anomaly_count
      - last_error_code
      additionalProperties: false
    DatabaseStatus:
      type: object
      properties:
        state:
          enum:
          - available
          - unavailable
          - unknown
        last_error_code:
          enum:
          - null
          - DB_UNAVAILABLE
          - DB_BUSY
          - DB_IO_ERROR
          - DB_OTHER
      required:
      - state
      - last_error_code
      additionalProperties: false
    PushStatus:
      type: object
      properties:
        state:
          enum:
          - available
          - degraded
          - unknown
        last_error_code:
          enum:
          - null
          - PUSH_UNAVAILABLE
          - PUSH_REJECTED
          - PUSH_OTHER
      required:
      - state
      - last_error_code
      additionalProperties: false
    AdminSystemStatus:
      type: object
      properties:
        observed_at:
          $ref: '#/components/schemas/UTCDateTime'
        queue:
          $ref: '#/components/schemas/QueueStatus'
        connections:
          $ref: '#/components/schemas/ConnectionStatus'
        attachment_recovery:
          $ref: '#/components/schemas/AttachmentRecoveryStatus'
        database:
          $ref: '#/components/schemas/DatabaseStatus'
        push:
          $ref: '#/components/schemas/PushStatus'
      required:
      - observed_at
      - queue
      - connections
      - attachment_recovery
      - database
      - push
      additionalProperties: false
      description: 管理员只读系统元数据允许列表；不含消息正文、callback_data、附件URL/路径、原始异常、SQL、凭据或FCM注册。错误仅映射稳定分类码，无自由文本；null表示无可展示错误记录，unknown表示尚无观测。不是settings或配置版本投影。
    PushProvider:
      type: string
      enum:
      - fcm
      - opush
    PushBarrierVersion:
      type: integer
      minimum: 0
      maximum: 9223372036854775807
      description: 当前会话+provider持久版本屏障；0仅从未注册，删除不归零。
    PushRegistrationVersion:
      type: integer
      minimum: 1
      maximum: 9223372036854775807
    PushRegistrationUpdate:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/PushProvider'
        token:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: 不回显、不写日志；合成示例不是真实厂商凭据。
        registration_version:
          $ref: '#/components/schemas/PushRegistrationVersion'
        expected_version:
          $ref: '#/components/schemas/PushBarrierVersion'
      required:
      - provider
      - token
      - registration_version
      - expected_version
      additionalProperties: false
    PushRegistrationDelete:
      type: object
      properties:
        expected_version:
          $ref: '#/components/schemas/PushBarrierVersion'
      required:
      - expected_version
      additionalProperties: false
    PushRegistration:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/PushProvider'
        registration_version:
          $ref: '#/components/schemas/PushBarrierVersion'
        registered:
          type: boolean
        updated_at:
          oneOf:
          - $ref: '#/components/schemas/UTCDateTime'
          - type: 'null'
      required:
      - provider
      - registration_version
      - registered
      - updated_at
      additionalProperties: false
      allOf:
      - if:
          properties:
            registration_version:
              const: 0
        then:
          properties:
            registered:
              const: false
            updated_at:
              type: 'null'
        else:
          properties:
            updated_at:
              $ref: '#/components/schemas/UTCDateTime'
    PushRegistrationState:
      type: object
      properties:
        session_id:
          $ref: '#/components/schemas/ID'
        registrations:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/PushRegistration'
          allOf:
          - contains:
              properties:
                provider:
                  const: fcm
              required:
              - provider
            minContains: 1
            maxContains: 1
          - contains:
              properties:
                provider:
                  const: opush
              required:
              - provider
            minContains: 1
            maxContains: 1
      required:
      - session_id
      - registrations
      additionalProperties: false

    WSProtocolVersion:
      type: object
      properties:
        major:
          type: integer
          minimum: 1
        minor:
          type: integer
          minimum: 0
      required:
      - major
      - minor
      additionalProperties: false
    WSHello:
      type: object
      properties:
        type:
          const: hello
        epoch:
          $ref: '#/components/schemas/SyncEpoch'
        change_seq:
          $ref: '#/components/schemas/Sequence'
        protocol_version:
          $ref: '#/components/schemas/WSProtocolVersion'
      required:
      - type
      - epoch
      - change_seq
      - protocol_version
      additionalProperties: false
    WSChangesAvailable:
      type: object
      properties:
        type:
          const: changes_available
        change_seq:
          $ref: '#/components/schemas/Sequence'
      required:
      - type
      - change_seq
      additionalProperties: false
    WSSessionRevoked:
      type: object
      properties:
        type:
          const: session_revoked
      required:
      - type
      additionalProperties: false
    WSUnknownOptional:
      type: object
      properties:
        type:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          not:
            enum:
            - hello
            - changes_available
            - session_revoked
        optional:
          const: true
      required:
      - type
      - optional
      additionalProperties: false
    WSFrame:
      description: 仅服务端JSON提示frame；已知事件严格封闭。未知可选事件仅允许无载荷envelope，忽略且不推进游标；控制ping/pong不是JSON frame。
      oneOf:
      - $ref: '#/components/schemas/WSHello'
      - $ref: '#/components/schemas/WSChangesAvailable'
      - $ref: '#/components/schemas/WSSessionRevoked'
      - $ref: '#/components/schemas/WSUnknownOptional'
    ID:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      description: 服务端 UUID v4；ID 本身不授予访问权限。
      maxLength: 36
    Sequence:
      type: string
      pattern: ^(0|[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
      description: SQLite 非负 64 位序号的规范十进制字符串；禁止数字、前导零及指数形式。bot_seq/change_seq/read_seq 不可互换。
      not:
        pattern: '[^0-9]'
    Version:
      type: integer
      minimum: 1
      description: 从 1 开始的实体版本；不等于序号或凭据代次。
    UTCDateTime:
      type: string
      format: date-time
      pattern: Z$
      description: UTC RFC3339 时间。
    OpaqueCursor:
      type: string
      minLength: 1
      description: 不透明分页令牌；客户端原样回传，不推导序号或采用 offset。
    Pagination:
      type: object
      properties:
        next_cursor:
          oneOf:
          - $ref: '#/components/schemas/OpaqueCursor'
          - type: 'null'
        has_more:
          type: boolean
      required:
      - next_cursor
      - has_more
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              pattern: ^[A-Z][A-Z0-9_]*$
              description: 稳定机器码；按 code 分支，不匹配中文 message。后续卡可增加 code。
            message:
              type: string
            request_id:
              type: string
              minLength: 1
            retryable:
              type: boolean
          required:
          - code
          - message
          - request_id
          - retryable
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Capabilities:
      type: object
      properties:
        send:
          type: boolean
        receive:
          type: boolean
      required:
      - send
      - receive
      additionalProperties: false
      description: Bot API 授权能力。send 可创建/编辑自身 application 消息并上传附件；receive 可 claim/ACK/renew 及下载对应投递附件；不能管理 Bot 或跨
        Bot。停用覆盖两项授权。
    LoginRequest:
      oneOf:
      - type: object
        properties:
          username:
            type: string
            minLength: 1
          password:
            type: string
            minLength: 1
            writeOnly: true
          client_type:
            const: web
          device_name:
            type: string
            minLength: 1
        required:
        - username
        - password
        - client_type
        - device_name
        additionalProperties: false
      - type: object
        properties:
          username:
            type: string
            minLength: 1
          password:
            type: string
            minLength: 1
            writeOnly: true
          client_type:
            const: android
          device_name:
            type: string
            minLength: 1
          device_id:
            $ref: '#/components/schemas/ID'
        required:
        - username
        - password
        - client_type
        - device_name
        - device_id
        additionalProperties: false
      description: 唯一管理员，无注册/SSO/RelayShelf 依赖。Android 每安装生成 device_id；Web 登录验证同源 Origin。用户名/密码错误统一返回 401 AUTHENTICATION_FAILED。
    Administrator:
      type: object
      properties:
        username:
          type: string
          minLength: 1
      required:
      - username
      additionalProperties: false
    DeviceSessionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          oneOf:
          - $ref: '#/components/schemas/OpaqueCursor'
          - type: 'null'
        has_more:
          type: boolean
      required:
      - items
      - next_cursor
      - has_more
      additionalProperties: false
      description: 当前管理员有效设备会话的有界元数据页；无凭据、推送token或CSRF。过期/撤销会话不列出；分页不承诺跨页快照，操作时重新鉴权。时间复用Session服务端UTC到期时间。
    Session:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        administrator:
          $ref: '#/components/schemas/Administrator'
        client_type:
          enum:
          - web
          - android
        device_id:
          $ref: '#/components/schemas/ID'
        device_name:
          type: string
          minLength: 1
        idle_expires_at:
          $ref: '#/components/schemas/UTCDateTime'
        absolute_expires_at:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - id
      - administrator
      - client_type
      - device_id
      - device_name
      - idle_expires_at
      - absolute_expires_at
      additionalProperties: false
      description: 仅会话元数据，无 Token/密码摘要。有效请求可延长空闲期但不超过绝对期限；过期需重新登录。
    WebSession:
      allOf:
      - $ref: '#/components/schemas/Session'
      - properties:
          client_type:
            const: web
    AndroidSession:
      allOf:
      - $ref: '#/components/schemas/Session'
      - properties:
          client_type:
            const: android
    WebSessionResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/WebSession'
        csrf_token:
          type: string
          minLength: 1
      required:
      - session
      - csrf_token
      additionalProperties: false
      description: Web CSRF bootstrap；csrf_token 不得写日志。Cookie 会话不在 JSON 中返回。
    AndroidSessionResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/AndroidSession'
      required:
      - session
      additionalProperties: false
    SessionResponse:
      oneOf:
      - $ref: '#/components/schemas/WebSessionResponse'
      - $ref: '#/components/schemas/AndroidSessionResponse'
    AndroidLoginResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/AndroidSession'
        access_token:
          type: string
          minLength: 1
        token_type:
          const: Bearer
      required:
      - session
      - access_token
      - token_type
      additionalProperties: false
      description: 仅 Android 登录成功返回会话 Bearer；后续 GET session 不再返回。
    LoginResponse:
      oneOf:
      - $ref: '#/components/schemas/WebSessionResponse'
      - $ref: '#/components/schemas/AndroidLoginResponse'
    CredentialMetadata:
      type: object
      properties:
        credential_id:
          type: string
          minLength: 1
        generation:
          type: integer
          minimum: 1
      required:
      - credential_id
      - generation
      additionalProperties: false
      description: 公开查找标识与撤销代次，无密钥或摘要。两套凭据独立生成、独立摘要存储，各至少 256 bit 随机。
    BotCredentials:
      type: object
      properties:
        api_token:
          $ref: '#/components/schemas/CredentialMetadata'
        webhook_key:
          $ref: '#/components/schemas/CredentialMetadata'
      required:
      - api_token
      - webhook_key
      additionalProperties: false
    Bot:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        version:
          $ref: '#/components/schemas/Version'
        credentials:
          $ref: '#/components/schemas/BotCredentials'
        connection:
          type: object
          properties:
            state:
              enum:
              - recent_poll
              - unknown
            last_poll_at:
              oneOf:
              - $ref: '#/components/schemas/UTCDateTime'
              - type: 'null'
          required:
          - state
          - last_poll_at
          additionalProperties: false
      required:
      - id
      - name
      - enabled
      - capabilities
      - version
      - credentials
      - connection
      additionalProperties: false
      description: 仅管理元数据；recent_poll 表示近期应用轮询，不承诺业务消费者持续在线；Webhook-only 为 unknown。无正文、附件、历史、callback_data 或原始异常。
    CreateBotRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/Capabilities'
      required:
      - name
      - enabled
      - capabilities
      additionalProperties: false
    PatchBotRequest:
      type: object
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/Capabilities'
      required:
      - expected_version
      additionalProperties: false
      description: 版本比较防覆盖；停用/授权变更按提交前重新鉴权，停用不清空队列。
    DeleteBotRequest:
      type: object
      properties:
        confirm_name:
          type: string
          minLength: 1
        expected_version:
          $ref: '#/components/schemas/Version'
      required:
      - confirm_name
      - expected_version
      additionalProperties: false
      description: UI 二次确认后显式提交 Bot 名称与当前版本；永久删除凭据/历史/受保护队列，异步回收无引用附件。
    IssuedAPIToken:
      type: object
      properties:
        credential:
          $ref: '#/components/schemas/CredentialMetadata'
        token:
          type: string
          minLength: 1
        capabilities:
          $ref: '#/components/schemas/Capabilities'
      required:
      - credential
      - token
      - capabilities
      additionalProperties: false
      description: 仅创建/重置响应返回明文；绑定本 Bot 的 send/receive 授权；不可替代 Webhook Key。
    IssuedWebhookKey:
      type: object
      properties:
        credential:
          $ref: '#/components/schemas/CredentialMetadata'
        key:
          type: string
          minLength: 1
      required:
      - credential
      - key
      additionalProperties: false
      description: 仅创建/重置返回；仅 Authorization Bearer 用于 POST /webhooks/{bot_id} 创建标准消息。不可用于读、编辑、上传、claim/ACK/renew
        或管理接口。
    CreatedBotResponse:
      type: object
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
        api_token:
          $ref: '#/components/schemas/IssuedAPIToken'
        webhook_key:
          $ref: '#/components/schemas/IssuedWebhookKey'
      required:
      - bot
      - api_token
      - webhook_key
      additionalProperties: false
    BotPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Bot'
        next_cursor:
          oneOf:
          - $ref: '#/components/schemas/OpaqueCursor'
          - type: 'null'
        has_more:
          type: boolean
      required:
      - items
      - next_cursor
      - has_more
      additionalProperties: false
      description: 有界管理元数据分页；不包含任何消息历史。
    MessageText:
      type: string
      maxLength: 65536
      x-utf8-max-bytes: 65536
      description: UTF-8 最多 64 KiB；maxLength 仅为字符数上界，运行时还必须检查编码后的字节数。不截断。
    CallbackData:
      type: string
      maxLength: 4096
      x-utf8-max-bytes: 4096
      description: UTF-8 最多 4 KiB，允许空字符串；逐字保留，不 trim、不解释命令、不记录日志。
    MessageButton:
      oneOf:
      - type: object
        properties:
          id: &id001
            type: string
            minLength: 1
          label: &id002
            type: string
            minLength: 1
            maxLength: 128
          url:
            type: string
            format: uri
            description: 普通外部链接，不自动抓取为附件。
            pattern: '^[A-Za-z][A-Za-z0-9+.-]*:'
            not:
              pattern: '[\x00-\x20\x7f]'
        required:
        - id
        - label
        - url
        additionalProperties: false
      - type: object
        properties:
          id: *id001
          label: *id002
          callback_data:
            $ref: '#/components/schemas/CallbackData'
        required:
        - id
        - label
        - callback_data
        additionalProperties: false
      description: URL 与 callback_data 严格互斥。每消息内 button id 必须唯一，由服务语义校验。
    MessageButtons:
      type: array
      items:
        type: array
        items:
          $ref: '#/components/schemas/MessageButton'
        minItems: 1
        maxItems: 5
      maxItems: 10
    AttachmentReference:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        kind:
          enum:
          - image
          - file
      required:
      - id
      - kind
      additionalProperties: false
    CreateMessageRequest:
      type: object
      properties:
        format: &id003
          enum:
          - plain
          - markdown
        text: &id004
          $ref: '#/components/schemas/MessageText'
        attachments: &id005
          type: array
          items:
            $ref: '#/components/schemas/AttachmentReference'
          maxItems: 10
          uniqueItems: true
        reply_to_message_id: &id006
          oneOf:
          - $ref: '#/components/schemas/ID'
          - type: 'null'
        buttons: &id007
          $ref: '#/components/schemas/MessageButtons'
      required:
      - format
      additionalProperties: false
      anyOf: &id008
      - required:
        - text
        properties:
          text:
            minLength: 1
      - required:
        - attachments
        properties:
          attachments:
            minItems: 1
      - required:
        - buttons
        properties:
          buttons:
            minItems: 1
      description: 标准消息载荷；text/attachments/buttons 省略分别视为空字符串/空数组/空数组，reply 省略视为 null。三类内容至少一类非空；附件 ID 不得重复，kind
        必须符合存储元数据；所有引用和附件均属当前 Bot，附件必须 ready 且身份允许发送。sender、bot_id、revision 由服务生成，调用方不可指定。普通回复保留原引用 ID；源消息自然过期后显示引用已过期，不无限保存正文。
    EditMessageRequest:
      type: object
      properties:
        format: *id003
        text: *id004
        attachments: *id005
        reply_to_message_id: *id006
        buttons: *id007
        expected_revision:
          $ref: '#/components/schemas/Version'
      required:
      - format
      - expected_revision
      additionalProperties: false
      anyOf: *id008
      description: 完整替换当前内容，省略字段按创建时空值处理；不是字段局部合并。仅 Bot send 编辑自身 application 消息。CAS 检查失败返回 409 REVISION_CONFLICT；完整校验后同事务更新正文、revision、附件关系及
        message.updated。bot_seq/created_at 不变，不增加未读、不重新响铃；仅保留当前正文。
    Message:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        bot_id:
          $ref: '#/components/schemas/ID'
        bot_seq:
          $ref: '#/components/schemas/Sequence'
        revision:
          $ref: '#/components/schemas/Version'
        sender:
          enum:
          - application
          - administrator
        format: *id003
        text: *id004
        attachments: *id005
        reply_to_message_id: *id006
        buttons: *id007
        created_at:
          $ref: '#/components/schemas/UTCDateTime'
        updated_at:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - id
      - bot_id
      - bot_seq
      - revision
      - sender
      - format
      - text
      - attachments
      - reply_to_message_id
      - buttons
      - created_at
      - updated_at
      additionalProperties: false
      description: 当前消息快照；sender 由身份确定。仅授权客户端历史/详情、消息写入回执返回正文，不向 Web 管理路由开放。reply_to_message_id 保留原 ID，即使引用自然过期；缺失引用详情以
        404 表示，客户端显示引用已过期。
      anyOf:
      - required:
        - text
        properties:
          text:
            minLength: 1
      - required:
        - attachments
        properties:
          attachments:
            minItems: 1
      - required:
        - buttons
        properties:
          buttons:
            minItems: 1
    ClientMessageReceipt:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/Message'
        delivery_id:
          $ref: '#/components/schemas/ID'
      required:
      - message
      - delivery_id
      additionalProperties: false
      description: 持久化成功才返回；delivery_id 只表示已建立应用投递，不表示业务执行完成。
    CallbackRequest:
      type: object
      properties:
        message_id:
          $ref: '#/components/schemas/ID'
        message_revision:
          $ref: '#/components/schemas/Version'
        button_id:
          type: string
          minLength: 1
      required:
      - message_id
      - message_revision
      - button_id
      additionalProperties: false
      description: 点击提交消息/版本/按钮 ID；callback_data 从该版本按钮快照读取，不信任客户端传参。来源管理员和设备由当前 Android 会话确定。
    CallbackReceipt:
      type: object
      properties:
        event_id:
          $ref: '#/components/schemas/ID'
        delivery_id:
          $ref: '#/components/schemas/ID'
        message_id:
          $ref: '#/components/schemas/ID'
        message_revision:
          $ref: '#/components/schemas/Version'
        button_id:
          type: string
          minLength: 1
        callback_data:
          $ref: '#/components/schemas/CallbackData'
        created_at:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - event_id
      - delivery_id
      - message_id
      - message_revision
      - button_id
      - callback_data
      - created_at
      additionalProperties: false
      description: 独立 button.callback 交互回执，不创建可见聊天消息。服务持久化点击时参数快照、管理员身份及来源设备；随后编辑不得改写快照。同一次点击重试复用键，再次点击使用新键；Hub
        不解释业务参数或执行 MCP。
    MessagePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_cursor:
          oneOf:
          - $ref: '#/components/schemas/OpaqueCursor'
          - type: 'null'
        has_more:
          type: boolean
      required:
      - items
      - next_cursor
      - has_more
      additionalProperties: false
      description: 按 bot_seq 从新到旧返回有界历史；cursor 是该 Bot 的不透明 bot_seq 边界，不能跨 Bot 或用 offset。next_cursor 末页为 null；has_more
        与其一致。编辑不改变排序。复用通用分页字段语义，不含同步游标/epoch。
    Attachment:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        bot_id:
          $ref: '#/components/schemas/ID'
        kind:
          enum:
          - image
          - file
        filename:
          type: string
          minLength: 1
        media_type:
          type: string
          minLength: 1
        size:
          $ref: '#/components/schemas/Sequence'
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        state:
          const: ready
        created_at:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - id
      - bot_id
      - kind
      - filename
      - media_type
      - size
      - sha256
      - state
      - created_at
      additionalProperties: false
      description: 仅完整持久化后的 ready 附件；size 为实际字节数十进制字符串，sha256 为内容摘要。不返回物理路径/存储键。原始文件名只作显示；不可拼接存储路径。
    ByteRanges:
      type: string
      pattern: ^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)(?:, *(?:[0-9]+-[0-9]*|-[0-9]+))*$
      x-byte-ranges: true
      description: 字节区间，含闭区间、开放结尾、suffix 及多区间；数字仅 ASCII。显式 start > end 非法（400），相对实际大小全不相交或 suffix=0 返回416；部分相交截至末字节，至少一个可满足时206。资源零字节时所有有效
        Range 均416。
    ContentRange:
      type: string
      # 显式断言后面没有任何字符，避免 $ 在最终 LF 前匹配；兼容 JSON Schema 正则。
      pattern: ^bytes (?:[0-9]+-[0-9]+/[0-9]+|\*/[0-9]+)(?![\s\S])
      description: 206 单区间为 bytes start-end/size；416 为 bytes */size。区间/长度与真实文件一致，运行时验证。 206 必须满足 0 <= start <= end
        < size；416 为不含区间的 */size。
      x-content-range: true
    StrongETag:
      type: string
      pattern: ^"[0-9a-f]{64}"$
      minLength: 66
      maxLength: 66
      description: ready 文件 SHA-256 的带双引号强 ETag。
    ConsumerID:
      type: string
      minLength: 1
      maxLength: 128
      description: 应用实例标识；不是授权，不能替代当前Bot凭据或租约Token。
    LeaseToken:
      type: string
      minLength: 1
      description: 服务生成不可预测的不透明租约Token，只返回获准领取者；服务保存摘要。绑定Bot、consumer、API凭据代次及本次领取，客户端不得推导或复用到下一租约。
    ClaimRequest:
      type: object
      properties:
        consumer_id:
          $ref: '#/components/schemas/ConsumerID'
        wait_seconds:
          type: integer
          minimum: 0
          maximum: 30
          default: 25
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      required:
      - consumer_id
      additionalProperties: false
    MessageDeliveryEvent:
      type: object
      properties:
        type:
          const: message.created
        message:
          allOf:
          - $ref: '#/components/schemas/Message'
          - properties:
              sender:
                const: administrator
      required:
      - type
      - message
      additionalProperties: false
      description: Android消息创建时的不可变载荷快照，不按后来编辑重建；不是Android同步change事件。
    CallbackDeliveryEvent:
      type: object
      properties:
        type:
          const: button.callback
        message_id:
          $ref: '#/components/schemas/ID'
        message_revision:
          $ref: '#/components/schemas/Version'
        button_id:
          type: string
          minLength: 1
        callback_data:
          $ref: '#/components/schemas/CallbackData'
        administrator_id:
          $ref: '#/components/schemas/ID'
        device_id:
          $ref: '#/components/schemas/ID'
        created_at:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - type
      - message_id
      - message_revision
      - button_id
      - callback_data
      - administrator_id
      - device_id
      - created_at
      additionalProperties: false
      description: 点击时不可变参数及来源身份快照；Hub不解释callback_data。关联父消息/必要附件受保护，附件仅按本Bot领取事件授权下载。
    DeliveryEvent:
      oneOf:
      - $ref: '#/components/schemas/MessageDeliveryEvent'
      - $ref: '#/components/schemas/CallbackDeliveryEvent'
    ClaimedDelivery:
      type: object
      properties:
        delivery_id:
          $ref: '#/components/schemas/ID'
        event_id:
          $ref: '#/components/schemas/ID'
        attempt:
          type: integer
          minimum: 1
        retry_generation:
          $ref: '#/components/schemas/Sequence'
        lease_token:
          $ref: '#/components/schemas/LeaseToken'
        lease_until:
          $ref: '#/components/schemas/UTCDateTime'
        event:
          $ref: '#/components/schemas/DeliveryEvent'
      required:
      - delivery_id
      - event_id
      - attempt
      - retry_generation
      - lease_token
      - lease_until
      - event
      additionalProperties: false
      description: attempt为当前代实际领取序号（从1起），只有租约到期才消耗本次尝试；retry_generation初始为字符串0，手动重试递增。事件/投递ID跨重投及手动重试稳定。lease_until是服务端UTC，默认领取起120秒。
    ClaimResponse:
      type: object
      properties:
        deliveries:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ClaimedDelivery'
      required:
      - deliveries
      additionalProperties: false
      description: 最多请求limit条；等待超时200空数组，查询/存储失败不得伪装为空队列。
    LeaseRequest:
      type: object
      properties:
        consumer_id:
          $ref: '#/components/schemas/ConsumerID'
        lease_token:
          $ref: '#/components/schemas/LeaseToken'
      required:
      - consumer_id
      - lease_token
      additionalProperties: false
    RenewRequest:
      type: object
      properties:
        consumer_id:
          $ref: '#/components/schemas/ConsumerID'
        lease_token:
          $ref: '#/components/schemas/LeaseToken'
        extend_seconds:
          type: integer
          minimum: 1
          maximum: 120
      required:
      - consumer_id
      - lease_token
      - extend_seconds
      additionalProperties: false
      description: 在当前lease_until上延长指定秒数；新到期不得超过本次领取时间+600秒（包括初始租约）。超限409 LEASE_LIMIT_EXCEEDED，不截断；重复续约仍须有效租约且计入累计时限，无Idempotency-Key保证。
    AckReceipt:
      type: object
      properties:
        delivery_id:
          $ref: '#/components/schemas/ID'
        event_id:
          $ref: '#/components/schemas/ID'
        state:
          const: acked
        acked_at:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - delivery_id
      - event_id
      - state
      - acked_at
      additionalProperties: false
      description: 只确认传输已可靠接收，不代表已读、业务执行成功或恰好执行一次。同成功租约重试200返回原acked_at。
    RenewReceipt:
      type: object
      properties:
        delivery_id:
          $ref: '#/components/schemas/ID'
        lease_until:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - delivery_id
      - lease_until
      additionalProperties: false
      description: 当前有效租约续约成功；不轮换lease_token、不改变event_id、不增加实际领取次数。
    DeliveryState:
      enum:
      - pending
      - leased
      - retry_wait
      - acked
      - failed
    DeliveryMetadata:
      type: object
      properties:
        delivery_id:
          $ref: '#/components/schemas/ID'
        event_id:
          $ref: '#/components/schemas/ID'
        bot_id:
          $ref: '#/components/schemas/ID'
        state:
          $ref: '#/components/schemas/DeliveryState'
        state_version:
          $ref: '#/components/schemas/Version'
        attempt:
          type: integer
          minimum: 0
        retry_generation:
          $ref: '#/components/schemas/Sequence'
        created_at:
          $ref: '#/components/schemas/UTCDateTime'
        updated_at:
          $ref: '#/components/schemas/UTCDateTime'
        lease_until:
          oneOf:
          - $ref: '#/components/schemas/UTCDateTime'
          - type: 'null'
        next_attempt_at:
          oneOf:
          - $ref: '#/components/schemas/UTCDateTime'
          - type: 'null'
        acked_at:
          oneOf:
          - $ref: '#/components/schemas/UTCDateTime'
          - type: 'null'
        error_code:
          oneOf:
          - type: string
            pattern: ^[A-Z][A-Z0-9_]*(?![\s\S])
          - type: 'null'
      required:
      - delivery_id
      - event_id
      - bot_id
      - state
      - state_version
      - attempt
      - retry_generation
      - created_at
      - updated_at
      - lease_until
      - next_attempt_at
      - acked_at
      - error_code
      additionalProperties: false
      description: 管理专用允许列表。error_code只来自服务端脱敏稳定码映射，不能拼接远端输入。禁止正文、callback_data、附件信息/地址、租约Token、consumer、原始异常。attempt为本代已领取序号（未领取为0），retry_generation初始0；acked_at仅acked非空、lease_until仅leased非空、next_attempt_at仅retry_wait非空。无消费者/纯等待/停用不消耗尝试。
      allOf:
      - if:
          properties:
            state:
              const: acked
        then:
          properties:
            acked_at:
              $ref: '#/components/schemas/UTCDateTime'
        else:
          properties:
            acked_at:
              type: 'null'
      - if:
          properties:
            state:
              const: leased
        then:
          properties:
            lease_until:
              $ref: '#/components/schemas/UTCDateTime'
        else:
          properties:
            lease_until:
              type: 'null'
      - if:
          properties:
            state:
              const: retry_wait
        then:
          properties:
            next_attempt_at:
              $ref: '#/components/schemas/UTCDateTime'
        else:
          properties:
            next_attempt_at:
              type: 'null'
    DeliveryMetadataPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryMetadata'
        next_cursor:
          oneOf:
          - $ref: '#/components/schemas/OpaqueCursor'
          - type: 'null'
        has_more:
          type: boolean
      required:
      - items
      - next_cursor
      - has_more
      additionalProperties: false
      description: 有界管理分页，cursor绑定筛选条件和位置；不能复用于消息历史或同步。末页next_cursor=null且has_more=false。
    RetryDeliveryRequest:
      type: object
      properties: {}
      required: []
      additionalProperties: false
      description: 空JSON对象；不接收新载荷、不执行或重跑业务。
    RetryDeliveryReceipt:
      type: object
      properties:
        delivery:
          allOf:
          - $ref: '#/components/schemas/DeliveryMetadata'
          - properties:
              state:
                const: pending
              attempt:
                const: 0
              error_code:
                type: 'null'
      required:
      - delivery
      additionalProperties: false
      description: failed→pending后的元数据快照；新retry_generation，attempt重置0；同键恢复原结果，即使随后状态已变化。
    SyncEpoch:
      type: string
      minLength: 1
      description: 服务端同步历史世代的不透明标识；客户端原样保存，不使用客户端时间。
    ReadState:
      type: object
      properties:
        bot_id:
          $ref: '#/components/schemas/ID'
        read_seq:
          $ref: '#/components/schemas/Sequence'
        version:
          $ref: '#/components/schemas/Version'
        updated_at:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - bot_id
      - read_seq
      - version
      - updated_at
      additionalProperties: false
    UpdateReadRequest:
      type: object
      properties:
        through_seq:
          $ref: '#/components/schemas/Sequence'
      required:
      - through_seq
      additionalProperties: false
    UpdateReadResponse:
      type: object
      properties:
        read:
          $ref: '#/components/schemas/ReadState'
        server_time:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - read
      - server_time
      additionalProperties: false
      description: 返回 max(原read_seq,through_seq)；未前进时版本/updated_at不变且不重复产生共享变更。server_time为本次服务端响应时间。
    SyncMessageUpsert:
      type: object
      properties:
        type:
          const: message.upsert
        change_seq:
          $ref: '#/components/schemas/Sequence'
        message:
          $ref: '#/components/schemas/Message'
      required:
      - type
      - change_seq
      - message
      additionalProperties: false
    SyncMessageDelete:
      type: object
      properties:
        type:
          const: message.deleted
        change_seq:
          $ref: '#/components/schemas/Sequence'
        id:
          $ref: '#/components/schemas/ID'
        bot_id:
          $ref: '#/components/schemas/ID'
        bot_seq:
          $ref: '#/components/schemas/Sequence'
        revision:
          $ref: '#/components/schemas/Version'
        deleted_at:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - type
      - change_seq
      - id
      - bot_id
      - bot_seq
      - revision
      - deleted_at
      additionalProperties: false
    SyncBotUpsert:
      type: object
      properties:
        type:
          const: bot.upsert
        change_seq:
          $ref: '#/components/schemas/Sequence'
        bot:
          $ref: '#/components/schemas/Bot'
      required:
      - type
      - change_seq
      - bot
      additionalProperties: false
    SyncBotDelete:
      type: object
      properties:
        type:
          const: bot.deleted
        change_seq:
          $ref: '#/components/schemas/Sequence'
        id:
          $ref: '#/components/schemas/ID'
        version:
          $ref: '#/components/schemas/Version'
        deleted_at:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - type
      - change_seq
      - id
      - version
      - deleted_at
      additionalProperties: false
    SyncReadUpdate:
      type: object
      properties:
        type:
          const: read.updated
        change_seq:
          $ref: '#/components/schemas/Sequence'
        read:
          $ref: '#/components/schemas/ReadState'
      required:
      - type
      - change_seq
      - read
      additionalProperties: false
    SyncDeliveryUpsert:
      type: object
      properties:
        type:
          const: delivery.upsert
        change_seq:
          $ref: '#/components/schemas/Sequence'
        delivery:
          $ref: '#/components/schemas/DeliveryMetadata'
      required:
      - type
      - change_seq
      - delivery
      additionalProperties: false
    SyncChange:
      oneOf:
      - $ref: '#/components/schemas/SyncMessageUpsert'
      - $ref: '#/components/schemas/SyncMessageDelete'
      - $ref: '#/components/schemas/SyncBotUpsert'
      - $ref: '#/components/schemas/SyncBotDelete'
      - $ref: '#/components/schemas/SyncReadUpdate'
      - $ref: '#/components/schemas/SyncDeliveryUpsert'
      - $ref: '#/components/schemas/SyncDeviceNotifications'
      - $ref: '#/components/schemas/SyncGlobalSettings'
      description: 事件序号与当前投影分离；同一读事务解析当前实体。消息revision、Bot.version、ReadState.version及delivery.state_version分别单调；旧版/重复删除均幂等no-op。已删除对象转换为对应删除类型，仅含墓碑，无旧正文；允许投影版本高于事件版本乃至H内事件版本。删除版本为实体终态版本，不复活同一ID。设备通知设置以device.notifications.updated显式扩展，按settings.device_id过滤且仅较高settings_version应用；GET
        /devices/current/notifications恢复。 全局settings.updated仅携带版本及/admin/settings关联；管理正文权限不变，重复/旧版本幂等忽略。
    SyncPage:
      type: object
      properties:
        epoch:
          $ref: '#/components/schemas/SyncEpoch'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
          maxItems: 200
        next_cursor:
          $ref: '#/components/schemas/OpaqueCursor'
        has_more:
          type: boolean
        server_high_watermark:
          $ref: '#/components/schemas/Sequence'
        server_time:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - epoch
      - changes
      - next_cursor
      - has_more
      - server_high_watermark
      - server_time
      additionalProperties: false
      x-sync-envelope: true
      description: H为追赶轮次固定高水位；changes按change_seq严格递增且不超过H，最多min(limit,200)条。next_cursor始终非空：未完成绑定原H及最后已消费位置，完成推进至H并标记轮次结束，下次请求冻结新的H。空轮次合法且has_more=false。server_time为服务端生成批次时间，不参与并发比较。
    BootstrapMessage:
      type: object
      properties:
        created_change_seq:
          $ref: '#/components/schemas/Sequence'
        message:
          $ref: '#/components/schemas/Message'
      required:
      - created_change_seq
      - message
      additionalProperties: false
    BootstrapPage:
      type: object
      properties:
        kind:
          const: page
          type: string
        epoch:
          $ref: '#/components/schemas/SyncEpoch'
        server_high_watermark:
          $ref: '#/components/schemas/Sequence'
        retention_floor:
          $ref: '#/components/schemas/Sequence'
        bots:
          type: array
          items:
            $ref: '#/components/schemas/Bot'
        read_states:
          type: array
          items:
            $ref: '#/components/schemas/ReadState'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/BootstrapMessage'
          maxItems: 200
        page_token:
          $ref: '#/components/schemas/OpaqueCursor'
        next_token:
          oneOf:
          - $ref: '#/components/schemas/OpaqueCursor'
          - type: 'null'
        has_more:
          type: boolean
        sync_cursor:
          description: 服务端完整性保护的bootstrap-seed；同身份/epoch、位置H且轮次完成，调用sync开启捕获当前高水位的新轮次；原seed不可用于verify。
          $ref: '#/components/schemas/OpaqueCursor'
        issued_at:
          $ref: '#/components/schemas/UTCDateTime'
        expires_at:
          $ref: '#/components/schemas/UTCDateTime'
        server_time:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - kind
      - epoch
      - server_high_watermark
      - retention_floor
      - bots
      - read_states
      - messages
      - page_token
      - next_token
      - has_more
      - sync_cursor
      - issued_at
      - expires_at
      - server_time
      additionalProperties: false
      x-bootstrap-envelope: true
    BootstrapVerified:
      description: 仅在末页receipt有效且服务端验证游标签发用途为实际sync结果、轮次完成且位置≥原H后返回；无变化sync结果位置可等于H。
      x-bootstrap-verified: true
      type: object
      properties:
        kind:
          const: verified
          type: string
        epoch:
          $ref: '#/components/schemas/SyncEpoch'
        server_high_watermark:
          $ref: '#/components/schemas/Sequence'
        retention_floor:
          $ref: '#/components/schemas/Sequence'
        catchup_position:
          $ref: '#/components/schemas/Sequence'
        server_time:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - kind
      - epoch
      - server_high_watermark
      - retention_floor
      - catchup_position
      - server_time
      additionalProperties: false
    BootstrapResponse:
      oneOf:
      - $ref: '#/components/schemas/BootstrapPage'
      - $ref: '#/components/schemas/BootstrapVerified'
    NotificationSettingsVersion:
      type: integer
      minimum: 0
      maximum: 9223372036854775807
      description: 服务端设备配置版本；0仅虚拟默认，非客户端时间，首次CAS从0开始。
    NotificationDND:
      type: object
      properties:
        enabled:
          type: boolean
        timezone:
          type: string
          minLength: 1
          maxLength: 128
        start:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
        end:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
      required:
      - enabled
      - timezone
      - start
      - end
      additionalProperties: false
      x-notification-dnd: true
      description: IANA时区；start包含/end不包含，每日时段，start>end跨午夜，禁止相等。按该时区当时实际本地时间计算，包含DST重复时刻；缺失时刻自然无匹配。禁用仍保存有效配置。
    NotificationBotOverride:
      type: object
      properties:
        bot_id:
          $ref: '#/components/schemas/ID'
        enabled:
          type: boolean
      required:
      - bot_id
      - enabled
      additionalProperties: false
    NotificationSettingsUpdate:
      type: object
      properties:
        expected_version:
          $ref: '#/components/schemas/NotificationSettingsVersion'
        enabled:
          type: boolean
        bot_overrides:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/NotificationBotOverride'
          x-unique-bot-overrides: true
          description: 完整替换的设备局部Bot覆盖；未列出Bot默认启用，与设备总开关取AND。仅引用当前身份有权的未删除Bot，否则404。
        dnd:
          $ref: '#/components/schemas/NotificationDND'
        preview:
          type: boolean
        notify_channel:
          type: string
          enum:
          - fcm
          - vendor
          - none
        notify_provider:
          type:
          - string
          - 'null'
          enum:
          - fcm
          - opush
          - null
      required:
      - expected_version
      - enabled
      - bot_overrides
      - dnd
      - preview
      - notify_channel
      - notify_provider
      additionalProperties: false
      oneOf:
      - properties:
          notify_channel:
            const: fcm
          notify_provider:
            const: fcm
      - properties:
          notify_channel:
            const: vendor
          notify_provider:
            const: opush
      - properties:
          notify_channel:
            const: none
          notify_provider:
            const: null
      description: 完整配置替换而非局部patch；不接受device_id/session_id/时间/版本或平台资格，设备归属从当前认证Session取得。
    NotificationSettings:
      type: object
      properties:
        device_id:
          $ref: '#/components/schemas/ID'
        settings_version:
          $ref: '#/components/schemas/NotificationSettingsVersion'
        updated_at:
          oneOf:
          - $ref: '#/components/schemas/UTCDateTime'
          - type: 'null'
        enabled:
          type: boolean
        bot_overrides:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/NotificationBotOverride'
          x-unique-bot-overrides: true
          description: 完整替换的设备局部Bot覆盖；未列出Bot默认启用，与设备总开关取AND。仅引用当前身份有权的未删除Bot，否则404。
        dnd:
          $ref: '#/components/schemas/NotificationDND'
        preview:
          type: boolean
        notify_channel:
          type: string
          enum:
          - fcm
          - vendor
          - none
        notify_provider:
          type:
          - string
          - 'null'
          enum:
          - fcm
          - opush
          - null
      required:
      - device_id
      - settings_version
      - updated_at
      - enabled
      - bot_overrides
      - dnd
      - preview
      - notify_channel
      - notify_provider
      additionalProperties: false
      oneOf:
      - properties:
          notify_channel:
            const: fcm
          notify_provider:
            const: fcm
      - properties:
          notify_channel:
            const: vendor
          notify_provider:
            const: opush
      - properties:
          notify_channel:
            const: none
          notify_provider:
            const: null
      allOf:
      - if:
          properties:
            settings_version:
              const: 0
        then:
          properties:
            updated_at:
              type: 'null'
            enabled:
              const: true
            bot_overrides:
              const: []
            dnd:
              const:
                enabled: false
                timezone: UTC
                start: '22:00'
                end: 07:00
            preview:
              const: false
            notify_channel:
              const: fcm
            notify_provider:
              const: fcm
        else:
          properties:
            updated_at:
              $ref: '#/components/schemas/UTCDateTime'
    NotificationSettingsState:
      type: object
      properties:
        settings:
          $ref: '#/components/schemas/NotificationSettings'
        server_time:
          $ref: '#/components/schemas/UTCDateTime'
      required:
      - settings
      - server_time
      additionalProperties: false
    NotificationSettingsConflict:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              pattern: ^[A-Z][A-Z0-9_]*$
              description: 稳定机器码；按 code 分支，不匹配中文 message。后续卡可增加 code。
              enum:
              - SETTINGS_CONFLICT
              - SETTINGS_VERSION_EXHAUSTED
            message:
              type: string
            request_id:
              type: string
              minLength: 1
            retryable:
              type: boolean
            latest_settings_version:
              $ref: '#/components/schemas/NotificationSettingsVersion'
            recovery_path:
              const: /devices/current/notifications
          required:
          - code
          - message
          - request_id
          - retryable
          - latest_settings_version
          - recovery_path
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    SyncDeviceNotifications:
      type: object
      properties:
        type:
          const: device.notifications.updated
        change_seq:
          $ref: '#/components/schemas/Sequence'
        settings:
          allOf:
          - $ref: '#/components/schemas/NotificationSettings'
          - properties:
              settings_version:
                minimum: 1
      required:
      - type
      - change_seq
      - settings
      additionalProperties: false
      description: 仅认证设备device_id应用；其他设备事件忽略投影但仍按原批次提交游标，同设备仅较高settings_version替换。GET恢复先校验当前认证设备，再按版本应用，旧响应不得倒退；同device_id多Session共享偏好，不共享注册。
    NotificationJobSnapshot:
      type: object
      properties:
        session_id:
          $ref: '#/components/schemas/ID'
        device_id:
          $ref: '#/components/schemas/ID'
        purpose:
          enum:
          - sync
          - alert
        target_watermark:
          $ref: '#/components/schemas/Sequence'
        provider:
          $ref: '#/components/schemas/PushProvider'
        registration_version:
          $ref: '#/components/schemas/PushRegistrationVersion'
        settings_version:
          $ref: '#/components/schemas/NotificationSettingsVersion'
        reminder_key:
          type: object
          properties:
            deployment_id:
              $ref: '#/components/schemas/ID'
            message_id:
              $ref: '#/components/schemas/ID'
          required:
          - deployment_id
          - message_id
          additionalProperties: false
        bot_id:
          $ref: '#/components/schemas/ID'
        bot_seq:
          $ref: '#/components/schemas/Sequence'
        expires_at:
          $ref: '#/components/schemas/UTCDateTime'
        alert_eligible:
          type: boolean
      required:
      - session_id
      - device_id
      - purpose
      - target_watermark
      - provider
      - registration_version
      - settings_version
      - reminder_key
      - bot_id
      - bot_seq
      - expires_at
      - alert_eligible
      additionalProperties: false
      description: 仅内部契约夹具，不是HTTP队列或厂商payload。sync也携带关联稳定键但不产生提醒；派生提醒须保留原事件资格/版本，不可由目标水位合并复活。
      allOf:
      - if:
          properties:
            purpose:
              const: sync
        then:
          properties:
            provider:
              const: fcm
  responses:
    '400':
      description: 格式错误
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: 未认证、过期或撤销
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '403':
      description: 越权或 CSRF/同源检查失败
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: 无权或不存在资源
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: 版本冲突
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '410':
      description: 资源或游标过期
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '413':
      description: 请求超限
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '422':
      description: 字段语义错误
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '429':
      description: 限流
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
        Retry-After:
          description: 尽量提供重试等待秒数或 HTTP 日期。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '503':
      description: 存储或暂时不可用
      headers:
        Cache-Control:
          description: 受保护响应固定 no-store。
          schema:
            type: string
            const: no-store
        Retry-After:
          description: 尽量提供重试等待秒数或 HTTP 日期。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      description: Android 管理员设备会话；非 JWT，自包含 Token 不能替代可撤销会话。Bot 凭据不能访问管理接口。
    WebCookie:
      type: apiKey
      in: cookie
      name: relaynest_session
      description: Web 管理会话；HttpOnly、SameSite=Lax，外部 HTTPS 时 Secure；同一唯一管理员。
    CSRF:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Web 写操作验证会话 CSRF 及同源 Origin/Referer；不适用于无会话的登录。
    BotAPIToken:
      type: http
      scheme: bearer
      description: 仅本 Bot 的 send/receive 授权；不能用于 /auth、/admin 或 Webhook。
    WebhookKey:
      type: http
      scheme: bearer
      description: 独立、仅发送；仅 POST /webhooks/{bot_id}，禁止在 URL 携带。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: 客户端生成 UUID v4。作用域=管理员或 Bot 身份+路由类别，与 Token 版本无关。规范化摘要含路径目标 Bot/资源 ID、有效字段/附件 ID/引用/按钮，排除 Authorization；编辑含
        expected_revision，callback 含点击目标和版本，上传含目标 Bot/元数据/实际文件摘要。同键同请求返回原状态/结果；不同内容409 IDEMPOTENCY_CONFLICT。编辑重放先恢复原结果，再判断新的
        CAS，防止成功重试误报冲突。存活消息及投递期间保留记录；清理后最小墓碑7天，命中410 RESOURCE_EXPIRED，不重新创建；受保护投递记录不按7天删除。窗口后不承诺去重，客户端不得自动重放未知旧意图。
        重放仍须先验证当前身份/能力/授权；重置后使用新有效凭据恢复，不能以旧已撤销Token换回结果。callback 重放先恢复原交互，再判断新点击的按钮时效。
